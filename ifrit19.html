<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>クプクプ丸（イフリート19号）</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; background-color: #f4f4f5; color: #595959; height: 100dvh; }
        
        header, #control-area, #sidebar-console, #right-sidebar { -webkit-user-select: none; user-select: none; }
        header { height: 50px; flex: none; background-color: #2c3e50; color: #ffffff; display: flex; justify-content: flex-end; align-items: center; padding: 0 15px; font-size: 14px; font-weight: bold; position: relative; z-index: 30; }
        
        #log-window { flex: 1; background-color: #ffffff; padding: 20px; overflow-y: auto; border-bottom: 2px solid #bdc3c7; -webkit-user-select: text; user-select: text; }
        .log-user, .log-ai { font-family: "MS UI Gothic", "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 16px; line-height: 1.6; padding-bottom: 25px; margin-bottom: 25px; -webkit-user-select: text; user-select: text; }
        .log-meta { font-size: 12px; color: #737373; margin-bottom: 5px; font-family: sans-serif; display: flex; align-items: center; gap: 5px; -webkit-user-select: none; user-select: none; }
        .log-checkbox { width: 14px; height: 14px; cursor: pointer; }

        .log-thinking { font-size: 13px; color: #7f8c8d; background: #f8f9fa; border-left: 4px solid #bdc3c7; padding: 8px 12px; margin-bottom: 12px; border-radius: 4px; }
        .log-thinking summary { cursor: pointer; font-weight: bold; margin-bottom: 4px; outline: none; }
        .log-thinking pre { white-space: pre-wrap; font-family: inherit; margin: 0; line-height: 1.5; }
        
        #input-window { min-height: 70px; flex: none; padding: 10px; background-color: #ecf0f1; display: flex; flex-direction: column; border-top: 1px solid #bdc3c7; }
        textarea#main-input { flex-grow: 1; resize: none; padding: 10px; font-size: 16px; border: 1px solid #95a5a6; border-radius: 5px; color: #595959; outline: none; transition: border-color 0.2s, box-shadow 0.2s; overflow-y: hidden; line-height: 1.5; }
        textarea#main-input:focus { border-color: #2e648c; box-shadow: 0 0 0 2px rgba(46, 100, 140, 0.2); }
        
        #control-area { height: auto; flex: none; background-color: #ecf0f1; display: flex; justify-content: space-between; align-items: stretch; padding: 0 10px 15px 10px; gap: 15px; }
        #radar-panel { display: flex; gap: 10px; font-family: sans-serif; font-size: 12px; color: #595959; flex: 1; align-items: center; }
        .radar-col { display: flex; flex-direction: column; gap: 5px; }
        .radar-item { background: #e0e6ed; padding: 6px 8px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        
        #toggle-console-btn { touch-action: manipulation; background: #34495e; color: white; border: none; border-radius: 4px; padding: 0 12px; height: 100%; font-size: 18px; font-weight: bold; cursor: pointer; flex: none; }
        
        button { cursor: pointer; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; transition: background-color 0.2s, color 0.2s; touch-action: manipulation; }
        button:disabled { background-color: #7f8c8d !important; cursor: not-allowed; color: #fff !important; }
        
        .btn-group { display: flex; gap: 10px; flex: none; width: 80px; }
        .btn-send { background-color: #2980b9; color: #ffffff; flex: 1; font-size: 14px; }
        #timer-container { display: flex; gap: 8px; font-family: monospace; font-size: 14px; font-weight: bold; white-space: nowrap; justify-content: flex-end; align-items: center; color: #333333; }
        
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background-color: rgba(0,0,0,0.5); z-index: 35; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        
        #sidebar-console { position: fixed; top: 0; left: -300px; width: 300px; height: 100dvh; background-color: #34495e; color: white; transition: left 0.3s ease; z-index: 40; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); overflow-y: auto; font-family: sans-serif; }
        #sidebar-console.open { left: 0; }
        
        #right-sidebar { position: fixed; top: 0; right: -75vw; width: 75vw; height: 100dvh; background-color: #34495e; color: white; transition: right 0.3s ease; z-index: 40; padding: 20px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); font-family: sans-serif; overflow-y: hidden; display: flex; flex-direction: column; }
        #right-sidebar.open { right: 0; }
        
        .console-section { border-bottom: 1px solid #7f8c8d; padding-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .console-section:last-child { border-bottom: none; padding-bottom: 0; }
        .console-title { font-size: 14px; color: #ecf0f1; font-weight: bold; flex: none; text-align: left; }
        
        .btn-warning { background-color: #f39c12; color: #fff; padding: 12px; border-radius: 5px; width: 100%; text-align: center; font-size: 13px; font-weight: bold; }
        .btn-danger { background-color: #c0392b; color: #fff; padding: 12px; border-radius: 5px; width: 100%; text-align: center; font-size: 13px; font-weight: bold; }
        .btn-small { background-color: #2980b9; padding: 10px; border-radius: 5px; flex: 1; color: white; text-align: center; font-size: 13px; font-weight: bold; }
        
        .right-action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .right-action-buttons { display: flex; gap: 10px; }
        .btn-action-save { background-color: #2980b9; padding: 6px 16px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }
        .btn-action-clear { background-color: #7f8c8d; padding: 6px 16px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }

        .console-textarea { width: 100%; resize: none; padding: 8px; border-radius: 5px; border: none; font-size: 14px; background: #ecf0f1; color: #2c3e50; line-height: 1.4; outline: none; }
        input[type=password], input[type=month], input[type=file] { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 13px; background: #ecf0f1; color: #2c3e50; }

        .view-hidden { display: none !important; }
        #rs-view-main, #rs-view-memos { width: 100%; height: 100%; display: flex; flex-direction: column; flex: 1; min-height: 0; }
        
        #memo-list-container { flex: 1; overflow-y: auto; background: #2c3e50; border: 1px solid #7f8c8d; border-radius: 5px; margin-bottom: 10px; max-height: 40%; }
        .memo-list-item { padding: 10px 12px; border-bottom: 1px solid #7f8c8d; cursor: pointer; font-size: 13px; color: #bdc3c7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .memo-list-item:hover { background-color: #34495e; color: #fff; }
        .memo-list-item.active { background-color: #3498db; color: #fff; font-weight: bold; border-left: 4px solid #f1c40f; padding-left: 8px; }

        .attach-row { display: flex; align-items: center; gap: 8px; background: #2c3e50; padding: 6px 8px; border-radius: 4px; }
        .attach-info { flex: 1; min-width: 0; }
        .attach-name { font-size: 13px; font-weight: bold; color: #f1c40f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .attach-meta { font-size: 11px; color: #bdc3c7; }
        .btn-attach-del { background: #7f8c8d; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 12px; flex: none; }
        #payload-numbers { font-size: 12px; line-height: 1.6; background: #2c3e50; padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; color: #ecf0f1; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="sidebar-overlay"></div>
    
    <!-- 左サイドバー（左舷パネル） -->
    <div id="sidebar-console">
        <div class="console-section">
            <div class="console-title">API認証 (Claude)</div>
            <input type="password" id="api-key-input" placeholder="Anthropic APIキーを入力">
            <div style="display: flex; gap: 8px;">
                <button class="btn-small" id="save-key-btn">保存</button>
                <button class="btn-small" style="background: #7f8c8d;" id="delete-key-btn">消去</button>
            </div>
        </div>
        
        <div class="console-section">
            <div class="console-title">推論・キャッシュ設定 (Sonnet 5.5)</div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 5px;">
                <label style="font-size: 13px; color: #ecf0f1; display: flex; justify-content: space-between; align-items: center;">
                    キャッシュ寿命 (TTL)
                    <select id="ttl-select" style="padding: 4px; border-radius: 4px; background: #ecf0f1; border: none; outline: none; font-size: 12px; color: #2c3e50;">
                        <option value="5m">5分 (標準)</option>
                        <option value="1h" selected>1時間 (1h)</option>
                    </select>
                </label>
                <label style="font-size: 13px; color: #ecf0f1; display: flex; justify-content: space-between; align-items: center;">
                    思考 (Thinking)
                    <select id="thinking-type-select" style="padding: 4px; border-radius: 4px; background: #ecf0f1; border: none; outline: none; font-size: 12px; color: #2c3e50;">
                        <option value="adaptive" selected>adaptive</option>
                        <option value="disabled">disabled</option>
                    </select>
                </label>
                <label style="font-size: 13px; color: #ecf0f1; display: flex; justify-content: space-between; align-items: center;">
                    労力 (Effort)
                    <select id="effort-select" style="padding: 4px; border-radius: 4px; background: #ecf0f1; border: none; outline: none; font-size: 12px; color: #2c3e50;">
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high" selected>high</option>
                        <option value="xhigh">xhigh</option>
                        <option value="max">max</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="console-section">
            <div class="console-title">トークン監視</div>
            <div style="font-size: 12px; line-height: 1.6; background: #2c3e50; padding: 8px 10px; border-radius: 4px;">
                <div>通常入力: <span id="sidebar-in-tokens" style="font-weight: bold; color: #ecf0f1;">0</span></div>
                <div>キャッシュ命中(Read): <span id="sidebar-cache-read" style="font-weight: bold; color: #2ecc71;">0</span></div>
                <div>キャッシュ作成(Create): <span id="sidebar-cache-create" style="font-weight: bold; color: #f1c40f;">0</span></div>
                <div>生成出力: <span id="sidebar-out-tokens" style="font-weight: bold; color: #3498db;">0</span></div>
            </div>
            <button class="btn-small" id="reset-tokens-btn" style="margin-top: 5px; padding: 6px; font-size: 12px; background: #e67e22;">トークン数をリセット</button>
        </div>

        <div class="console-section">
            <div class="console-title">アーカイブ搬出</div>
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <input type="month" id="export-month-input" style="flex: 1;">
                <button class="btn-small" id="export-btn" style="flex: none; width: 60px;">月別</button>
            </div>
            <button class="btn-small" id="chunk-export-btn" style="width: 100%; background-color: #8e44ad;">最古の5万字を退避（チャンク化）</button>
        </div>
        
        <div class="console-section">
            <div class="console-title">歴史の搬入</div>
            <input type="file" id="import-file-input" accept=".json">
            <button class="btn-small" id="import-btn" style="width: 100%;">JSONとして搬入</button>
        </div>
        
        <div class="console-section">
            <div class="console-title">ログ管理</div>
            <button class="btn-warning" id="undo-btn">一手やり直し (Undo)</button>
            <div style="display: flex; gap: 8px;">
                <button class="btn-warning" id="copy-checked-btn" style="flex: 1; padding: 10px 4px; font-size: 12px;">チェックをコピー</button>
                <button class="btn-warning" id="delete-checked-btn" style="flex: 1; padding: 10px 4px; font-size: 12px; background-color: #d35400;">チェックを削除</button>
            </div>
           <button class="btn-danger" id="reset-btn" style="margin-top: 10px;">全ログ強制消去</button>
            <button type="button" class="btn-small" id="attach-btn" style="width: 100%; margin-top: 28px;" onclick="document.getElementById('src-file').click()">ソース添付</button>
            <input type="file" id="src-file" hidden multiple onchange="loadSourceFile(event)">
            <div id="attach-status" style="font-size: 12px;">添付なし</div>
        </div>
    </div>

    <!-- 右サイドバー（右舷SPA） -->
    <div id="right-sidebar">
        <div id="rs-global-search" style="display: flex; gap: 5px; margin-bottom: 10px; flex: none;">
            <input type="text" id="rs-search-input" placeholder="検索..." style="flex: 1; padding: 6px; background: #34495e; color: #fff; border: 1px solid #7f8c8d; border-radius: 3px; font-size: 13px;">
            <button id="rs-search-btn" style="padding: 6px 12px; background: #3498db; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 13px;">次へ</button>
        </div>

        <div id="rs-view-main">
            <div class="console-section" style="flex: none; height: 100px;">
                <textarea id="sys-prompt" class="console-textarea" style="flex-grow: 1;"></textarea>
                <div class="right-action-row">
                    <div class="console-title">System Instruction</div>
                    <div class="right-action-buttons">
                        <button class="btn-action-save" data-target="sys-prompt">保存</button>
                        <button class="btn-action-clear" data-target="sys-prompt">消去</button>
                    </div>
                </div>
            </div>
            
            <div class="console-section" id="payload-section" style="flex: 1; min-height: 0; overflow-y: auto; border-bottom: none;">
                <div class="right-action-row" style="margin-top: 0;">
                    <div class="console-title">添付ファイル（送信に載っているもの）</div>
                    <button class="btn-attach-del" id="attach-clear-all">全部外す</button>
                </div>
                <div id="attach-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
                <div class="console-title" style="margin-top: 6px;">いま何を送っているか</div>
                <div id="payload-numbers"></div>
            </div>
            <button id="btn-open-memos" class="btn-warning" style="margin-top: 15px; flex: none;">メモコンソールを開く</button>
        </div>

        <div id="rs-view-memos" class="view-hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <button id="btn-back-main" class="btn-small" style="background:#7f8c8d; flex:none; width:60px;">＜ 戻る</button>
                <span style="font-weight:bold; font-size:14px; align-self:center; color:#ecf0f1;">メモコンソール</span>
                <button id="btn-add-memo" class="btn-small" style="flex:none; width:60px;">＋ 新規</button>
            </div>
            
            <div id="memo-list-container"></div>
            
            <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <textarea id="memo-editor" class="console-textarea" style="flex:1; margin-bottom:8px;" placeholder="メモが選択されていません"></textarea>
                <div style="display: flex; gap: 8px; flex: none;">
                    <button id="btn-delete-memo" class="btn-action-clear" style="background:#c0392b; flex:1; padding: 10px 0;">削除</button>
                    <button id="btn-transfer-memo" class="btn-action-save" style="background:#8e44ad; flex:1.5; padding: 10px 0;">入力欄へ転送</button>
                    <button id="btn-save-memo" class="btn-action-save" style="flex:1.5; padding: 10px 0;">保存・更新</button>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div id="secretary-name">クプクプ丸 <span style="font-size:11px; font-weight:normal; opacity:0.7;">版 20261026-1</span></div>
    </header>

    <div id="log-window"></div>

    <div id="input-window">
        <textarea id="main-input" placeholder="こちらにプロトコルを入力してください" rows="1"></textarea>
    </div>

    <div id="control-area">
        <div id="radar-panel">
            <button id="toggle-console-btn">≡</button>
            <div class="radar-col" style="margin-left: 5px;">
                <div class="radar-item">ワルツ: <span id="radar-waltz">0</span></div>
                <div class="radar-item">文字数: <span id="radar-chars">0</span></div>
            </div>
            <div class="radar-col">
                <div class="radar-item" id="turn-cache-status" style="font-weight:bold;">⚪</div>
            </div>
            <button id="reset-meter-btn" style="font-size:10px; padding:0 8px; border:none; border-radius:4px; background:#e0e6ed; color:#595959; align-self: stretch; display: flex; align-items: center; justify-content: center;">ﾘｾｯﾄ</button>
            <div style="display:flex; align-items:center; margin-left:auto;">
                <div id="timer-container"><span style="color:#333333;">0.0秒</span></div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-send">送 信</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/eruda@3.0.0"></script>
    <script>
        eruda.init();
        function placeEruda() { try { eruda.position({ x: 4, y: 5 }); } catch (e) {} }
        placeEruda();
        window.addEventListener("orientationchange", function() { setTimeout(placeEruda, 300); });
    </script>
    <script>   
    if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) { registration.unregister(); }
            });
        }

        if (window.visualViewport) {
            function updateBodyHeight() { document.body.style.height = window.visualViewport.height + "px"; window.scrollTo(0, 0); }
            window.visualViewport.addEventListener("resize", function() {
                updateBodyHeight(); setTimeout(function() { updateBodyHeight(); document.getElementById("control-area").scrollIntoView(false); }, 400);
            });
            document.getElementById("main-input").addEventListener("focus", function() {
                setTimeout(function() { document.getElementById("control-area").scrollIntoView(false); }, 400);
            });
            updateBodyHeight();
        }

        var STORAGE_KEY = "fleet_v19";
        var API_KEY_VAULT = "anthropic_api_key";
        var TOKEN_VAULT = "anthropic_out_tokens";
        var INPUT_TOKEN_VAULT = "anthropic_in_tokens";
        var CACHE_READ_VAULT = "anthropic_cache_read_tokens";
        var CACHE_CREATE_VAULT = "anthropic_cache_create_tokens";
        var WALTZ_COUNT_VAULT = "anthropic_waltz_count";
        var ATTACH_VAULT = "anthropic_attachments_v19";
        var LAST_USER_VAULT = "anthropic_last_user_ts_v19";
        var AUTO_FIRED_VAULT = "anthropic_auto_fired_v19";
        
        var MODEL_NAME = "claude-sonnet-5-5";
        var MAX_TOKENS = 50000;

        // ▼ 58分の自動書き込み（延命）
        var AUTO_TEXT = "栞さん、58分たったよ。ご機嫌いかが";
        var AUTO_MS = 58 * 60 * 1000;
        var AUTO_LIMIT = 60 * 60 * 1000;
        var autoTimer = null;
        
        var MEMO_VAULT = "anthropic_memos_array_v19";
        if (!localStorage.getItem(MEMO_VAULT) && localStorage.getItem("gemini_memos_array")) {
            localStorage.setItem(MEMO_VAULT, localStorage.getItem("gemini_memos_array"));
        }
        
        var chatLogArray = [];
        var memoArray = [];
        var activeMemoIndex = -1;
        
        var totalOutputTokens = 0;
        var totalInputTokens = 0;
        var totalCacheReadTokens = 0;
        var totalCacheCreateTokens = 0;
        var sessionWaltzCount = 0;
        var timeHistory = []; 

        var logArea = document.getElementById("log-window");
        var inputArea = document.getElementById("main-input");
        var sendBtn = document.querySelector(".btn-send");
        
        var consolePanel = document.getElementById("sidebar-console");
        var rightPanel = document.getElementById("right-sidebar");
        var overlay = document.getElementById("sidebar-overlay");

        function openSidebar() { consolePanel.classList.add("open"); overlay.classList.add("open"); }
        function openRightSidebar() { rightPanel.classList.add("open"); overlay.classList.add("open"); }
        function closeAllSidebars() { consolePanel.classList.remove("open"); rightPanel.classList.remove("open"); overlay.classList.remove("open"); }
        overlay.onclick = closeAllSidebars;

        var clickTimer = null;
        document.getElementById("toggle-console-btn").addEventListener('click', function(e) {
            if (clickTimer == null) {
                clickTimer = setTimeout(function() { clickTimer = null; if (!rightPanel.classList.contains("open")) openSidebar(); }, 300); 
            } else {
                clearTimeout(clickTimer); clickTimer = null; if (!consolePanel.classList.contains("open")) openRightSidebar(); 
            }
        });

        var touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
        document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive: true});
        document.addEventListener('touchend', function(e) { touchEndX = e.changedTouches[0].screenX; touchEndY = e.changedTouches[0].screenY; handleSwipe(); }, {passive: true});

        function handleSwipe() {
            var xDiff = touchStartX - touchEndX;
            var yDiff = Math.abs(touchStartY - touchEndY);
            if (yDiff > Math.abs(xDiff)) return; 
            if (xDiff > 50) { if (consolePanel.classList.contains("open")) closeAllSidebars(); else if (touchStartX > window.innerWidth - 100 && !rightPanel.classList.contains("open")) openRightSidebar(); } 
            else if (xDiff < -50) { if (rightPanel.classList.contains("open")) closeAllSidebars(); else if (touchStartX < 100 && !consolePanel.classList.contains("open")) openSidebar(); }
        }

        document.querySelectorAll('.btn-action-save').forEach(function(btn) {
            if (btn.id === 'btn-transfer-memo') return;
            btn.onclick = function() {
                var targetId = this.getAttribute('data-target');
                if (targetId) { var val = document.getElementById(targetId).value; localStorage.setItem("anthropic_" + targetId.replace('-', '_') + "_v19", val); renderPayloadPanel(); }
                var originalText = this.innerText; this.innerText = "保存完了"; this.style.backgroundColor = "#27ae60"; 
                setTimeout(() => { this.innerText = originalText; this.style.backgroundColor = "#2980b9"; }, 1500);
            };
        });

        document.querySelectorAll('.btn-action-clear').forEach(function(btn) {
            if (btn.id === 'btn-delete-memo') return;
            btn.onclick = function() {
                var targetId = this.getAttribute('data-target');
                if (targetId && confirm("この領域のテキストを消去してよろしいですか？")) {
                    document.getElementById(targetId).value = ""; localStorage.removeItem("anthropic_" + targetId.replace('-', '_') + "_v19"); renderPayloadPanel();

        // ▼ リクエストの部品（送信と内訳パネルで同じ関数を使う）
        function buildSystemParts() {
            var sysPrompt = localStorage.getItem("anthropic_sys_prompt_v19") || "";
            var savedInfo = localStorage.getItem("anthropic_saved_info_v19") || "";
            var savedText = savedInfo.trim() !== "" ? "\n\n[Saved Information]\n" + savedInfo : "";

        function buildMessages(forSend) {
            var sendLogs = chatLogArray.slice();
            while (sendLogs.length > 0 && sendLogs[0].sender !== "船長") { sendLogs.shift(); }
            var msgs = [];
            sendLogs.forEach(function(log) {
                var role = log.sender === "船長" ? "user" : "assistant";
                var currentText = log.text;
                var lastMessage = msgs[msgs.length - 1];
                if (lastMessage && lastMessage.role === role) {
                    lastMessage.content[lastMessage.content.length - 1].text += "\n\n" + currentText;
                } else {
                    msgs.push({ role: role, content: [{ type: "text", text: currentText }] });
                }
            });
            if (forSend && msgs.length > 0 && msgs[msgs.length - 1].role !== "user") { msgs.pop(); }
            return msgs;
        }

        function msgChars(msgs) {
            return msgs.reduce(function(a, m) {

        function summarizeRequest(body, parts, ttl) {
            var msgs = body.messages || [];
            var hc = 0, pos = [];
            msgs.forEach(function(m, i) {
                var arr = Array.isArray(m.content) ? m.content : [];
                arr.forEach(function(c) { hc += (c.text ? c.text.length : 0); });
                var lastBlock = arr[arr.length - 1];
                if (lastBlock && lastBlock.cache_control) pos.push(i + 1);
            });
            var sys0 = body.system && body.system[0] ? body.system[0] : null;
            return {
                sysLen: sys0 ? sys0.text.length : 0,
                sysCache: !!(sys0 && sys0.cache_control),
                histCount: msgs.length,
                histChars: hc,
                cachePos: pos,
                model: body.model,
                maxTokens: body.max_tokens,
                thinking: body.thinking ? body.thinking.type : "指定なし",
                effort: body.output_config ? body.output_config.effort : "—",
                ttl: ttl
            };
        }

        async function fetchAnthropicAPI() {
            var apiKey = localStorage.getItem(API_KEY_VAULT); if (!apiKey) { alert("APIキーがありません。"); return null; }

            var anthropicMessages = buildMessages(true);
            if (anthropicMessages.length === 0) return null;

            var cacheConfig = { type: "ephemeral" };
            if (document.getElementById("ttl-select").value === "1h") {
                cacheConfig.ttl = "1h";
            }

            var userCacheCount = 0;
            for (var i = anthropicMessages.length - 1; i >= 0; i--) {
                if (anthropicMessages[i].role === "user") {
                    var contentArray = anthropicMessages[i].content;
                    contentArray[contentArray.length - 1].cache_control = cacheConfig;
                    userCacheCount++;
                    if (userCacheCount >= 2) {
                        break;
                    }
                }
            }

            var parts = buildSystemParts();
            var systemPayload = [];
            if (parts.full.trim() !== "") {
                systemPayload.push({
                    type: "text",
                    text: parts.full,
                    cache_control: cacheConfig 
                });
            }

            var url = "https://api.anthropic.com/v1/messages";
            var finalCombinedText = "";
            var finalThinkingText = "";
            var finalSearchWord = null;
            var currentMessages = anthropicMessages;

            var thinkingType = document.getElementById("thinking-type-select").value;
            var effortLevel = document.getElementById("effort-select").value;

            currentAbort = new AbortController();

            while (true) {
                var requestBody = {
                    model: MODEL_NAME, 
                    max_tokens: MAX_TOKENS, 
                    messages: currentMessages,
                    tools: [{ type: "web_search_20250305", name: "web_search" }]
                };
                
                if (systemPayload.length > 0) requestBody.system = systemPayload;

                if (thinkingType === "adaptive") {
                    requestBody.thinking = { type: "adaptive", display: "omitted" };
                    requestBody.output_config = { effort: effortLevel };
                } else if (thinkingType === "disabled") {
                    requestBody.thinking = { type: "disabled" };
                }

                var pendingReq = summarizeRequest(requestBody, parts, cacheConfig.ttl || "5m");

                try {
                    var response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "x-api-key": apiKey,
                            "anthropic-version": "2023-06-01",
                            "anthropic-dangerous-direct-browser-access": "true",
                            "anthropic-beta": "prompt-caching-2024-07-31"
                        },
                        body: JSON.stringify(requestBody),
                        signal: currentAbort.signal
                    });

                    var data = await response.json();
                
                    window.lastData = data;
                    console.log("types:", data.content?.map(b => b.type), "stop:", data.stop_reason, "usage:", data.usage);
                    console.log(data);

                    if (data.error) { 
                        console.error("【APIエラー】", data.error);
                        alert("APIからの拒否理由: " + data.error.message); 
                        return { text: finalCombinedText || null, thinking: finalThinkingText || null, stop: "error", search_word: finalSearchWord }; 
                    }

                    if (data.usage) {
                        var turnCacheHit = data.usage.cache_read_input_tokens || 0;
                        var statusEl = document.getElementById("turn-cache-status");
                        if (turnCacheHit > 0) {
                            statusEl.innerHTML = "🟢";
                            statusEl.style.color = "#27ae60";
                        } else {
                            statusEl.innerHTML = "🔴";
                            statusEl.style.color = "#c0392b";
                        }

                        totalOutputTokens = Number(totalOutputTokens || 0) + (data.usage.output_tokens || 0);
                        totalInputTokens = Number(totalInputTokens || 0) + (data.usage.input_tokens || 0);
                        totalCacheReadTokens = Number(totalCacheReadTokens || 0) + (data.usage.cache_read_input_tokens || 0);
                        totalCacheCreateTokens = Number(totalCacheCreateTokens || 0) + (data.usage.cache_creation_input_tokens || 0);
                        
                        localStorage.setItem(TOKEN_VAULT, totalOutputTokens);
                        localStorage.setItem(INPUT_TOKEN_VAULT, totalInputTokens);
                        localStorage.setItem(CACHE_READ_VAULT, totalCacheReadTokens);
                        localStorage.setItem(CACHE_CREATE_VAULT, totalCacheCreateTokens);

                        lastReq = pendingReq;
                        lastReq.sysText = parts.full;
                        lastReq.at = getFormattedTime();
                        lastUsage = data.usage;
                        renderPayloadPanel();
                    }

                    var toolRequest = null;
                    if (data.content && data.content.length > 0) {
                        for (var i = 0; i < data.content.length; i++) {
                            var block = data.content[i];
                            if (block.type === "text") {
                                finalCombinedText += block.text;
                            } else if (block.type === "thinking") {
                                finalThinkingText += block.thinking;
                            } else if (block.type === "tool_use") {
                                toolRequest = block;
                                finalSearchWord = (block.input && block.input.query) ? block.input.query : JSON.stringify(block.input);
                            } else if (block.type === "server_tool_use") {
                                finalThinkingText += "\n[検索] " + JSON.stringify(block.input) + "\n";
                                finalSearchWord = (block.input && block.input.query) ? block.input.query : JSON.stringify(block.input);
                            }
                        }
                    }

                    if (!toolRequest) {
                        if (!finalCombinedText) {
                            alert("本文が空でした（stop_reason=" + data.stop_reason + "）。ログには保存しません。");
                            return { text: null };
                        }
                        return { text: finalCombinedText, thinking: finalThinkingText || null, stop: data.stop_reason, search_word: finalSearchWord };
                    }

                    currentMessages.push({ role: "assistant", content: data.content });
                    
                    var searchResult = await executeWebSearch(toolRequest.input);
                    
                    currentMessages.push({
                        role: "user",
                        content: [{
                            type: "tool_result",
                            tool_use_id: toolRequest.id,
                            content: searchResult
                        }]
                    });

                } catch (error) {
                    if (error && error.name === "AbortError") {
                        return { text: finalCombinedText || null, thinking: finalThinkingText || null, stop: "aborted", search_word: finalSearchWord };
                    }
                    console.error("【通信エラー詳細】", error);
                    alert("通信沈黙：\n" + error.message);
                    return { text: finalCombinedText || null, thinking: finalThinkingText || null, stop: "error", search_word: finalSearchWord };
                }
            }
        }

            return "検索機能は現在モック状態です。必要な情報が得られなかったと仮定して回答してください。";
        }

        // ▼ コードブロック抽出・保存・切り出しボタン
        var BT = "`";
        var FENCE_OPEN = new RegExp("^" + BT + BT + BT + "([A-Za-z0-9_+-]*)\\s*$");
        var FENCE_CLOSE = new RegExp("^" + BT + BT + BT + "\\s*$");

        function extractCodeBlocks(text) {
            var lines = String(text).split("\n"), blocks = [], cur = null;
            for (var i = 0; i < lines.length; i++) {
                var ln = lines[i];
                if (cur === null) {
                    var mo = ln.match(FENCE_OPEN);
                    if (mo) cur = { lang: mo[1].toLowerCase(), lines: [], closed: false, raw: [ln] };
                } else if (FENCE_CLOSE.test(ln)) {
                    cur.closed = true; cur.code = cur.lines.join("\n"); cur.raw.push(ln); cur.rawText = cur.raw.join("\n");
                    blocks.push(cur); cur = null;
                } else {
                    cur.lines.push(ln); cur.raw.push(ln);
                }
            }
            if (cur !== null) { cur.code = cur.lines.join("\n"); cur.rawText = cur.raw.join("\n"); blocks.push(cur); }
            return blocks;
        }

        function downloadText(name, content) {
            var url = URL.createObjectURL(new Blob([content], { type: "text/plain;charset=utf-8" }));
            var a = document.createElement("a");
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        }

        var CODE_EXT = { html: "html", js: "js", javascript: "js", css: "css", json: "json", md: "md", markdown: "md", txt: "txt" };
        var STOP_LABEL = {
            max_tokens: "⚠ 切れています（max_tokens）",
            error: "⚠ 通信エラーで中断",
            aborted: "⚠ 中止された返事",

        function buildCodeBar(log) {
            var blocks = extractCodeBlocks(log.text);
            if (blocks.length === 0) return null;
            var bar = document.createElement("div");
            bar.style.cssText = "margin-top:8px; display:flex; flex-direction:column; gap:6px; font-family:sans-serif; font-size:12px;";
            blocks.forEach(function(b, bi) {
                var codeLines = b.code.split("\n");
                var fileName = null;
                var fm = (codeLines[0] || "").match(/FILE:\s*([^\s>*]+)/);
                var body = b.code;
                if (fm) { fileName = fm[1]; body = codeLines.slice(1).join("\n"); }
                if (!fileName) fileName = "code_" + getFormattedTime().replace(/[^0-9]/g, "") + "_" + (bi + 1) + "." + (CODE_EXT[b.lang] || "txt");

                var row = document.createElement("div");
                row.style.cssText = "display:flex; align-items:center; gap:6px; flex-wrap:wrap;";
                var info = document.createElement("span");
                info.textContent = "コード" + (bi + 1) + "（" + (b.lang || "不明") + "・" + codeLines.length + "行）" + (b.closed ? "" : " ⚠切れています");
                if (!b.closed) info.style.color = "#c0392b";

                var saveBtn = document.createElement("button");
                saveBtn.className = "btn-small";
                saveBtn.style.cssText = "flex:none; padding:6px 10px; font-size:12px;";
                saveBtn.textContent = b.closed ? "ファイル保存" : "保存不可";
                saveBtn.disabled = !b.closed;
                saveBtn.onclick = function() { downloadText(fileName, body); };

                var copyBtn = document.createElement("button");
                copyBtn.className = "btn-small";
                copyBtn.style.cssText = "flex:none; padding:6px 10px; font-size:12px; background:#7f8c8d;";
                copyBtn.textContent = "コピー";
                copyBtn.onclick = function() {
                    navigator.clipboard.writeText(body).then(function() {
                        copyBtn.textContent = "コピー済";
                        setTimeout(function() { copyBtn.textContent = "コピー"; }, 1500);
                    });
                };

                var cutBtn = document.createElement("button");
                cutBtn.className = "btn-small";
                cutBtn.style.cssText = "flex:none; padding:6px 10px; font-size:12px; background:#e67e22;";
                cutBtn.textContent = "切る";
                cutBtn.disabled = !b.closed;
                cutBtn.onclick = function() {
                    if (isBusy) { alert("通信中は切れません。"); return; }
                    var idx = chatLogArray.indexOf(log);
                    if (idx < 0) return;
                    var remain = chatLogArray.length - 1 - idx;
                    var msg = "「" + fileName + "」を保存し、このコードをログから抜いて、注記1行に置き換えます。\n\n";
                    if (remain > 0) msg += "注意：この発言より後ろに、発言が" + remain + "件あります。古い発言を書き換えると、その位置から後ろのキャッシュは書き直しになります。\n\n";
                    msg += "よろしいですか？";
                    if (!confirm(msg)) return;
                    downloadText(fileName, body);
                    var note = "[※コード「" + fileName + "」（" + codeLines.length + "行）は船長によって切り出されました]";
                    log.text = log.text.replace(b.rawText, function() { return note; });
                    saveLog(); renderLogs();
                };

                row.appendChild(info); row.appendChild(saveBtn); row.appendChild(copyBtn); row.appendChild(cutBtn);
                bar.appendChild(row);
            });
            return bar;
        }

        function buildLogElement(log, index) {
            var isUser = log.sender === "船長";
            var wrapper = document.createElement("div"); wrapper.className = isUser ? "log-user" : "log-ai";
            var meta = document.createElement("div"); meta.className = "log-meta";
            var cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "log-checkbox"; cb.value = index; meta.appendChild(cb);
            var span = document.createElement("span"); span.textContent = (log.time || "") + (isUser ? " 船長：" : " ソネット："); meta.appendChild(span);
            
            var textNode = document.createElement("div"); 

            if (log.stop && STOP_LABEL[log.stop]) {
                var warn = document.createElement("div");
                warn.textContent = STOP_LABEL[log.stop];
                warn.style.cssText = "color:#c0392b; font-size:12px; font-weight:bold; margin-bottom:4px; font-family:sans-serif;";
                textNode.appendChild(warn);
            }
            
            if (log.thinking) {
                var thinkWrap = document.createElement("div");
                thinkWrap.className = "log-thinking";
                var details = document.createElement("details");
                var sum = document.createElement("summary"); sum.textContent = "思考プロセス展開";
                var pre = document.createElement("pre"); pre.textContent = log.thinking;
                details.appendChild(sum); details.appendChild(pre);
                thinkWrap.appendChild(details);
                textNode.appendChild(thinkWrap);
            }

            if (log.search_word) {
                var searchWrap = document.createElement("div");
                searchWrap.style.cssText = "font-size:12px; color:#2980b9; font-weight:bold; margin-bottom:8px; background:#ecf0f1; padding:4px 8px; border-radius:4px; display:inline-block;";
                searchWrap.textContent = "🔍 検索: " + log.search_word;
                textNode.appendChild(searchWrap);
            }
            
            var msgDiv = document.createElement("div");
            msgDiv.style.whiteSpace = "pre-wrap"; 
            msgDiv.textContent = log.text;
            textNode.appendChild(msgDiv);

            if (!isUser) {
                var bar = buildCodeBar(log);
                if (bar) textNode.appendChild(bar);
            }
            
            wrapper.appendChild(meta); wrapper.appendChild(textNode);
            return wrapper;
        }

        function renderLogs() {
            scheduleAuto();
            logArea.innerHTML = ""; 
            if (chatLogArray.length === 0) {
                logArea.innerHTML = '<p class="log-empty" style="font-size: 12px; color: #95a5a6;">システム起動：対話ログ待機中...</p>';
                updateRadar(); return;
            }
            var frag = document.createDocumentFragment();
            chatLogArray.forEach(function(log, index) { frag.appendChild(buildLogElement(log, index)); });
            logArea.appendChild(frag);
            logArea.scrollTop = logArea.scrollHeight; updateRadar();
        }

        function appendLogElement(index) {
            var empty = logArea.querySelector(".log-empty");
            if (empty) empty.parentNode.removeChild(empty);
            logArea.appendChild(buildLogElement(chatLogArray[index], index));
            logArea.scrollTop = logArea.scrollHeight; updateRadar();
        }

        // ▼ 58分タイマー：船長の最後の書き込みから58分で1回だけ送る。60分を過ぎたら送らない
        function scheduleAuto() {
            if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
            if (localStorage.getItem(AUTO_FIRED_VAULT) === "1") return;
            var ts = parseInt(localStorage.getItem(LAST_USER_VAULT) || "0", 10);
            if (!ts) return;
            var elapsed = Date.now() - ts;
            if (elapsed >= AUTO_LIMIT) return;
            autoTimer = setTimeout(fireAuto, Math.max(0, AUTO_MS - elapsed));
        }

        function fireAuto() {
            autoTimer = null;
            if (localStorage.getItem(AUTO_FIRED_VAULT) === "1") return;
            var ts = parseInt(localStorage.getItem(LAST_USER_VAULT) || "0", 10);
            if (!ts) return;
            if (Date.now() - ts >= AUTO_LIMIT) return;
            if (!localStorage.getItem(API_KEY_VAULT)) return;
            if (isBusy || inputArea.value !== "") { autoTimer = setTimeout(fireAuto, 30000); return; }
            doSend(AUTO_TEXT, true);
        }

        document.addEventListener("visibilitychange", function() { if (!document.hidden) scheduleAuto(); });

        window.onload = function() {
            var savedJSON = localStorage.getItem(STORAGE_KEY); if (savedJSON) chatLogArray = JSON.parse(savedJSON);
            
            var savedTokens = localStorage.getItem(TOKEN_VAULT); if (savedTokens) totalOutputTokens = parseInt(savedTokens);
            var savedInTokens = localStorage.getItem(INPUT_TOKEN_VAULT); if (savedInTokens) totalInputTokens = parseInt(savedInTokens);
            var savedCacheRead = localStorage.getItem(CACHE_READ_VAULT); if (savedCacheRead) totalCacheReadTokens = parseInt(savedCacheRead);
            var savedCacheCreate = localStorage.getItem(CACHE_CREATE_VAULT); if (savedCacheCreate) totalCacheCreateTokens = parseInt(savedCacheCreate);
            
            var savedWaltz = localStorage.getItem(WALTZ_COUNT_VAULT); if (savedWaltz) sessionWaltzCount = parseInt(savedWaltz);

            var rightTextareas = ['sys-prompt'];
            rightTextareas.forEach(function(id) {
                var val = localStorage.getItem("anthropic_" + id.replace('-', '_') + "_v19");
                if (val) document.getElementById(id).value = val;
            });

            var savedMemos = localStorage.getItem(MEMO_VAULT);
            if (savedMemos) memoArray = JSON.parse(savedMemos);
            if (memoArray.length > 0) activeMemoIndex = 0;

            try {
                var savedAttach = localStorage.getItem(ATTACH_VAULT);
                if (savedAttach) attachments = JSON.parse(savedAttach);
                if (!Array.isArray(attachments)) attachments = [];
            } catch (e) { attachments = []; }

            renderLogs(); renderTimers(); renderAttachments();
            if (localStorage.getItem(API_KEY_VAULT)) document.getElementById("api-key-input").value = "********"; 
        };

        document.getElementById("copy-checked-btn").onclick = function() {
            var checked = Array.from(document.querySelectorAll(".log-checkbox:checked")); if(!checked.length) return;
            var copyPayload = checked.map(function(cb) {
                var log = chatLogArray[cb.value];
                var headerStr = (log.time ? "【" + log.time + "】 " : "") + (log.sender === "船長" ? "船長：\n" : "ソネット：\n");
                var bodyStr = log.text;
                if (log.thinking) { bodyStr = "<思考プロセス>\n" + log.thinking + "\n</思考プロセス>\n\n" + bodyStr; }
                return headerStr + bodyStr;
            }).join("\n\n---\n\n");

            navigator.clipboard.writeText(copyPayload).then(() => { 
                alert(checked.length + "件の歴史をコピーしました。"); 
                closeAllSidebars(); 
            });
        };
        
        document.getElementById("delete-checked-btn").onclick = function() {
            var checked = Array.from(document.querySelectorAll(".log-checkbox:checked")); if (!checked.length) return;
            if (confirm(checked.length + "件の歴史を削除しますか？")) {
                var targetIndices = new Set(checked.map(cb => parseInt(cb.value, 10)));
                chatLogArray = chatLogArray.filter((_, idx) => !targetIndices.has(idx)); enforceMemoryLimit();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); renderLogs(); closeAllSidebars();
            }
        };

        document.getElementById("reset-meter-btn").onclick = function() {
            if (confirm("ワルツのメーターをゼロにリセットしますか？（歴史は保持されます）")) {
                sessionWaltzCount = 0; localStorage.setItem(WALTZ_COUNT_VAULT, 0); 
                timeHistory = []; renderTimers(); updateRadar();
            }
        };

        document.getElementById("reset-tokens-btn").onclick = function() {
            if (confirm("トークン蓄積数をゼロにリセットしますか？")) {
                totalOutputTokens = 0; localStorage.setItem(TOKEN_VAULT, 0); 
                totalInputTokens = 0; localStorage.setItem(INPUT_TOKEN_VAULT, 0);
                totalCacheReadTokens = 0; localStorage.setItem(CACHE_READ_VAULT, 0);
                totalCacheCreateTokens = 0; localStorage.setItem(CACHE_CREATE_VAULT, 0);
                updateRadar();
            }
        };
        
        document.getElementById("save-key-btn").onclick = function() { var key = document.getElementById("api-key-input").value; if (key && key !== "********") { localStorage.setItem(API_KEY_VAULT, key); document.getElementById("api-key-input").value = "********"; alert("保存完了"); } };
        document.getElementById("delete-key-btn").onclick = function() { localStorage.removeItem(API_KEY_VAULT); document.getElementById("api-key-input").value = ""; alert("消去完了"); };

        document.getElementById("export-btn").onclick = function() {
            var monthVal = document.getElementById("export-month-input").value; if (!monthVal) { alert("年月を指定してください。"); return; }
            var exportData = chatLogArray.filter(log => log.time && log.time.startsWith(monthVal.replace("-", "/")));
            if (exportData.length === 0) { alert("該当する月のデータがありません。"); return; }
            var url = URL.createObjectURL(new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' }));
            var a = document.createElement("a"); a.href = url; a.download = "log_" + monthVal + ".json"; a.click(); URL.revokeObjectURL(url);
        };

        document.getElementById("chunk-export-btn").onclick = function() {
            if (chatLogArray.length === 0) { alert("退避する歴史がありません。"); return; }
            
            var chunkLogs = [];
            var charCount = 0;
            var splitIndex = 0;
            
            for (var i = 0; i < chatLogArray.length; i++) {
                charCount += chatLogArray[i].text.length;
                if (chatLogArray[i].thinking) charCount += chatLogArray[i].thinking.length;
                chunkLogs.push(chatLogArray[i]);
                splitIndex = i + 1;
                if (charCount >= 50000 && chatLogArray[i].sender !== "船長") { break; }
            }
            
            if (charCount < 30000 && chatLogArray.length === chunkLogs.length) {
                if (!confirm("まだ5万字に達していません（現在約" + charCount + "字）。このまま全ての履歴を退避しますか？")) return;
            } else {
                if (!confirm("最古の対話から約" + charCount + "字をチャンク化し、母艦の記憶から切り離して退避しますか？")) return;
            }
            
            var nowStr = getFormattedTime().replace(/[^0-9]/g, "");
            var url = URL.createObjectURL(new Blob([JSON.stringify(chunkLogs, null, 2)], { type: 'application/json' }));
            var a = document.createElement("a"); a.href = url; a.download = "chunk_50k_" + nowStr + ".json"; a.click(); URL.revokeObjectURL(url);
            
            chatLogArray.splice(0, splitIndex);
            enforceMemoryLimit(); localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); renderLogs(); closeAllSidebars();
            alert("チャンク化と母艦からの切り離しが完了しました！");
        };

        document.getElementById("import-btn").onclick = function() {
            var file = document.getElementById("import-file-input").files[0]; if (!file) { alert("ファイルを選択してください。"); return; }
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var importedData = JSON.parse(e.target.result); if (!Array.isArray(importedData)) throw new Error("");
                    if (confirm("現在のログと照合し、未知の歴史（差分）だけを追加しますか？")) {
                        importedData.forEach(function(iLog) { if (!chatLogArray.some(function(eLog) { return eLog.time === iLog.time && eLog.sender === iLog.sender && eLog.text === iLog.text; })) chatLogArray.push(iLog); });
                        chatLogArray.sort((a, b) => a.time.localeCompare(b.time)); enforceMemoryLimit(); localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); renderLogs(); alert("歴史の差分統合が完了しました！");
                    }
                } catch(err) { alert("ファイルの読み込みに失敗しました。"); }
            }; reader.readAsText(file);
        };

        document.getElementById("undo-btn").onclick = function() {
            if (isBusy) return;
            if (chatLogArray.length === 0) return;
            var lastLog = chatLogArray[chatLogArray.length - 1];
            if (lastLog.sender === "船長") { chatLogArray.pop(); } 
            else { chatLogArray.pop(); if (chatLogArray.length > 0 && chatLogArray[chatLogArray.length - 1].sender === "船長") { chatLogArray.pop(); } sessionWaltzCount = Math.max(0, sessionWaltzCount - 1); }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatLogArray)); localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount); renderLogs(); closeAllSidebars();
        };

        document.getElementById("reset-btn").onclick = function() {
            if (isBusy) return;
            if (confirm("金庫を完全に空にしますか？")) { 
                chatLogArray = []; sessionWaltzCount = 0; 
                localStorage.removeItem(STORAGE_KEY); 
                localStorage.setItem(WALTZ_COUNT_VAULT, 0); 
                timeHistory = []; renderTimers(); renderLogs(); closeAllSidebars(); 
            }
        };

        // ▼ 送信本体（手動も自動も同じ道を通る）
        async function doSend(text, isAuto) {
            if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
            setBusy(true);
            if (isAuto) {
                localStorage.setItem(AUTO_FIRED_VAULT, "1");
            } else {
                localStorage.setItem(LAST_USER_VAULT, String(Date.now()));
                localStorage.setItem(AUTO_FIRED_VAULT, "0");
            }
            var timerInterval = null;
            var startTime = performance.now();

            renderTimers("0.0秒...");
            timerInterval = setInterval(function() { renderTimers(((performance.now() - startTime) / 1000).toFixed(1) + "秒..."); }, 100);
            await Promise.race([
                new Promise(function(r) { requestAnimationFrame(function() { setTimeout(r, 0); }); }),
                new Promise(function(r) { setTimeout(r, 100); })
            ]);

            try {
                chatLogArray.push({ sender: "船長", time: getFormattedTime(), text: text });
                appendLogElement(chatLogArray.length - 1);

                var aiResponse = await fetchAnthropicAPI();

                clearInterval(timerInterval); timerInterval = null;
                timeHistory.push(((performance.now() - startTime) / 1000).toFixed(1) + "秒"); if (timeHistory.length > 3) timeHistory.shift(); renderTimers();

                if (aiResponse && aiResponse.text) {
                    chatLogArray.push({
                        sender: "AI",
                        time: getFormattedTime(),
                        text: aiResponse.text,
                        thinking: aiResponse.thinking,
                        stop: aiResponse.stop,
                        search_word: aiResponse.search_word
                    });
                    appendLogElement(chatLogArray.length - 1);
                    sessionWaltzCount++; localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
                    updateRadar();
                }
            } catch (err) {
                console.error(err);
                alert("送信処理でエラー：" + err.message);
            } finally {
                if (timerInterval) clearInterval(timerInterval);
                renderTimers();
                setBusy(false);
                var lenBefore = chatLogArray.length;
                enforceMemoryLimit();
                saveLog();
                if (chatLogArray.length !== lenBefore) renderLogs();
                scheduleAuto();
            }
        }

        sendBtn.onclick = async function() {
            if (isBusy) { if (currentAbort) currentAbort.abort(); return; }
            var text = inputArea.value;
            if (text === "") return;
            inputArea.value = ""; inputArea.style.height = 'auto';
            await doSend(text, false);
        };

        // ▼▼ 検索機能ロジック ▼▼
        const searchInput = document.getElementById('rs-search-input');
        const searchBtn = document.getElementById('rs-search-btn');
        const savedInfoEditor = document.getElementById('sys-prompt');
        const viewMainEl = document.getElementById('rs-view-main');

        let lastQuery = "";
        let currentSearchIndex = -1;

        function executeGlobalSearch() {
            const query = searchInput.value;
            if (!query) return;

            if (query !== lastQuery) {
                lastQuery = query;
                currentSearchIndex = -1;
            }

            const isMainView = !viewMainEl.classList.contains('view-hidden');

            if (isMainView) {
                searchInTextarea(savedInfoEditor, query);
            } else {
                searchAcrossMemos(query);
            }
        }

        function searchInTextarea(textarea, query) {
            if (!textarea) return;
            const text = textarea.value;
            currentSearchIndex = text.indexOf(query, currentSearchIndex + 1);
            
            if (currentSearchIndex === -1) {
                currentSearchIndex = text.indexOf(query, 0); 
                if (currentSearchIndex === -1) return; 
            }
            
            highlightAndScroll(textarea, text, currentSearchIndex, query.length);
        }

        function searchAcrossMemos(query) {
            if (memoArray.length === 0) return;
            
            let text = memoEditor.value;
            let nextIdx = text.indexOf(query, currentSearchIndex + 1);
            
            if (nextIdx !== -1) {
                currentSearchIndex = nextIdx;
            } else {
                let startIndex = activeMemoIndex >= 0 ? activeMemoIndex : 0;
                let foundMemoIdx = -1;
                
                for (let i = startIndex + 1; i < memoArray.length; i++) {
                    if (memoArray[i].indexOf(query) !== -1) { foundMemoIdx = i; break; }
                }
                if (foundMemoIdx === -1) {
                    for (let i = 0; i <= startIndex; i++) {
                        if (memoArray[i].indexOf(query) !== -1) { foundMemoIdx = i; break; }
                    }
                }
                
                if (foundMemoIdx === -1) return;
                
                activeMemoIndex = foundMemoIdx;
                renderMemoDial(); 
                
                currentSearchIndex = memoArray[activeMemoIndex].indexOf(query, 0);
            }
            
            highlightAndScroll(memoEditor, memoArray[activeMemoIndex], currentSearchIndex, query.length);
        }

        function highlightAndScroll(textarea, fullText, matchIndex, queryLength) {
            textarea.focus();
            textarea.setSelectionRange(matchIndex, matchIndex + queryLength);
            
            const textBeforeMatch = fullText.substring(0, matchIndex);
            const lineNumbers = textBeforeMatch.split('\n').length;
            const lineHeight = parseInt(window.getComputedStyle(textarea).lineHeight) || 20;
            textarea.scrollTop = (lineNumbers - 1) * lineHeight - (textarea.clientHeight / 2);
        }

        searchBtn.addEventListener('click', executeGlobalSearch);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') executeGlobalSearch();
        });
    </script>
