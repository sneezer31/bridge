<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS - 機関室</title>
    <style>
        /* 計器盤に特化した無骨なデザイン */
        :root { --bg: #050505; --text: #00ff00; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        h1 { color: #ff9800; border-bottom: 1px dashed var(--border); padding-bottom: 10px; font-size: 1.5em; }
        .control-panel { margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        .btn { background: #222; color: #fff; border: 1px solid #555; padding: 10px 20px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .btn:active { background: #444; }
        .btn-scan { border-color: #ff9800; color: #ff9800; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 75vh; }
        .monitor { border: 1px solid var(--border); padding: 15px; background: #0a0a0a; overflow-y: auto; }
        .json-block { border-bottom: 1px dashed #222; margin-bottom: 15px; padding-bottom: 15px; white-space: pre-wrap; word-break: break-all; font-size: 0.85em; }
    </style>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>ARGUS [ RAW DATA MONITOR ]</h1>
    
    <div class="control-panel">
        <a href="index.html" class="btn">[← ブリッジ帰還]</a>
        <button id="btn-scan" class="btn btn-scan">SCAN (両ストレージ直視)</button>
    </div>

    <div class="grid">
        <div class="monitor">
            <h3 style="color:#00bcd4;">[ LOCAL: IndexedDB ]</h3>
            <div id="local-view">Standby...</div>
        </div>
        <div class="monitor">
            <h3 style="color:#f44336;">[ CLOUD: Firebase ]</h3>
            <div id="cloud-view">Standby...</div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="incredible.js"></script>
    <script>
        document.getElementById('btn-scan').addEventListener('click', async () => {
            const localView = document.getElementById('local-view');
            const cloudView = document.getElementById('cloud-view');
            localView.innerText = 'Scanning...';
            cloudView.innerText = 'Scanning...';
            
            // 1. Firebaseの生データ取得
            try {
                const snap = await window.db.collection('records').orderBy('updatedAt', 'desc').limit(20).get();
                let cloudHtml = '';
                snap.forEach(doc => { cloudHtml += `<div class="json-block">${JSON.stringify(doc.data(), null, 2)}</div>`; });
                cloudView.innerHTML = cloudHtml || 'データなし';
            } catch(e) {
                cloudView.innerHTML = `<span style="color:red;">Error: ${e.message}</span>`;
            }

            // 2. IndexedDBの生データ取得 (※IncredibleEngine側に getAll() メソッドを要求)
            try {
                // IncredibleEngine実装時に getAll() を追加して連携させます
                localView.innerHTML = '<div class="json-block">※栞・かなえに IncredibleEngine 側の getAll() メソッド実装を指示してください。</div>';
            } catch(e) {
                localView.innerHTML = `<span style="color:red;">Error: ${e.message}</span>`;
            }
        });
    </script>
</body>
</html>
