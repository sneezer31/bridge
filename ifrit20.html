<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>イフリート20号（自律母艦仕様・メモコンソール搭載）</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Firebase v9 compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  
    <script src="firebase-config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; overflow-x: hidden}
        body { display: flex; flex-direction: column; background-color: #f4f4f5; color: #595959; height: 100dvh; }
        
        header, #control-area, #sidebar-console, #right-sidebar { -webkit-user-select: none; user-select: none; }
        header { height: 40px; flex: none; background-color: #2c3e50; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 14px; font-weight: bold; position: relative; z-index: 30; }

        /* クルー切り替えメニュー */
        #secretary-name { cursor: pointer; padding: 10px 14px; }
        #crew-menu { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); min-width: 220px; background-color: #34495e; border-radius: 0 0 6px 6px; box-shadow: 0 3px 8px rgba(0,0,0,0.4); overflow: hidden; }
        .crew-menu-item { padding: 12px 16px; font-size: 14px; color: #ecf0f1; border-top: 1px solid #4a6178; cursor: pointer; }
        .crew-menu-item.active { background-color: #3498db; font-weight: bold; }
        .crew-menu-item.add { color: #f1c40f; }

        #log-window { padding: 15px 10px !important; }
        #log-window { flex: 1; background-color: #ffffff; padding: 15px 10px; overflow-y: auto; border-bottom: 2px solid #bdc3c7; -webkit-user-select: text; user-select: text; }
        .log-user, .log-ai { font-family: "MS UI Gothic", "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 16px; line-height: 1.6; -webkit-user-select: text; user-select: text; }
        .log-meta { font-size: 12px; color: #737373; margin-bottom: 20px; font-family: sans-serif; display: flex; align-items: center; gap: 5px; -webkit-user-select: none; user-select: none; }
        .log-checkbox { width: 14px; height: 14px; cursor: pointer; }
      /* 対話ブロックの構造的グループ化 */
.log-user, .log-ai {
    padding-bottom: 0 !important; /* 内部の不要な空行を完全排除 */
    margin-bottom: 40px !important; /* 次の発言ブロックとの間に明確な断絶を確保 */
}

.log-meta {
    margin-bottom: 10px !important; /* メタデータと「自身の発言本文」を視覚的に接着 */
}

        
        #input-window { min-height: 70px; flex: none; padding: 10px; background-color: #ecf0f1; display: flex; flex-direction: column; border-top: 1px solid #bdc3c7; }
        textarea#main-input { flex-grow: 1; resize: none; padding: 10px; font-size: 16px; border: 1px solid #95a5a6; border-radius: 5px; color: #595959; outline: none; transition: border-color 0.2s, box-shadow 0.2s; overflow-y: hidden; line-height: 1.5; }
        textarea#main-input:focus { border-color: #2e648c; box-shadow: 0 0 0 2px rgba(46, 100, 140, 0.2); }
        
        #control-area { height: auto; flex: none; background-color: #ecf0f1; display: flex; justify-content: space-between; align-items: stretch; padding: 0 10px 15px 10px; gap: 15px; }
        #radar-panel { display: flex; gap: 10px; font-family: sans-serif; font-size: 12px; color: #595959; flex: 1; align-items: center; }
        .radar-col { display: flex; flex-direction: column; gap: 5px; }
        .radar-item { background: #e0e6ed; padding: 6px 8px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        
        #toggle-console-btn { touch-action: manipulation; background: #34495e; color: white; border: none; border-radius: 4px; padding: 0 12px; height: 100%; font-size: 18px; font-weight: bold; cursor: pointer; flex: none; }
        
        button { cursor: pointer; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; transition: background-color 0.2s, color 0.2s; touch-action: manipulation; }
        button:disabled { background-color: #7f8c8d !important; cursor: not-allowed; color: #fff !important; }
        
        .btn-group { display: flex; gap: 10px; flex: none; width: 80px; }
        .btn-send { background-color: #2980b9; color: #ffffff; flex: 1; font-size: 14px; }
        #timer-container { display: flex; gap: 8px; font-family: monospace; font-size: 14px; font-weight: bold; white-space: nowrap; justify-content: flex-end; align-items: center; color: #333333; }
        
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background-color: rgba(0,0,0,0.5); z-index: 35; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        
        #sidebar-console { position: fixed; top: 0; left: -300px; width: 300px; height: 100dvh; background-color: #34495e; color: white; transition: left 0.3s ease; z-index: 40; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); overflow-y: auto; font-family: sans-serif; }
        #sidebar-console.open { left: 0; }
        
        #right-sidebar { position: fixed; top: 0; right: 0; transform: translateX(100%); width: 75vw; height: 100dvh; background-color: #34495e; color: white; transition: transform 0.3s ease; z-index: 40; padding: 20px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); font-family: sans-serif; overflow-y: hidden; }
        #right-sidebar.open { transform: translateX(0); }
        
        .console-section { border-bottom: 1px solid #7f8c8d; padding-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .console-section:last-child { border-bottom: none; padding-bottom: 0; }
        .console-title { font-size: 14px; color: #ecf0f1; font-weight: bold; flex: none; text-align: left; }
        
        .btn-warning { background-color: #f39c12; color: #fff; padding: 12px; border-radius: 5px; width: 100%; text-align: center; font-size: 13px; font-weight: bold; }
        .btn-danger { background-color: #c0392b; color: #fff; padding: 12px; border-radius: 5px; width: 100%; text-align: center; font-size: 13px; font-weight: bold; }
        .btn-small { background-color: #2980b9; padding: 10px; border-radius: 5px; flex: 1; color: white; text-align: center; font-size: 13px; font-weight: bold; }
        
        .right-action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .right-action-buttons { display: flex; gap: 10px; }
        .btn-action-save { background-color: #2980b9; padding: 6px 16px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }
        .btn-action-clear { background-color: #7f8c8d; padding: 6px 16px; border-radius: 4px; color: white; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }

        .console-textarea { width: 100%; resize: none; padding: 8px; border-radius: 5px; border: none; font-size: 14px; background: #ecf0f1; color: #2c3e50; line-height: 1.4; outline: none; }
        input[type=password], input[type=month], input[type=file] { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 13px; background: #ecf0f1; color: #2c3e50; }
        
        .view-hidden { display: none !important; }
        #rs-view-main, #rs-view-memos { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        #memo-list-container { flex: 1; overflow-y: auto; background: #2c3e50; border: 1px solid #7f8c8d; border-radius: 5px; margin-bottom: 10px; max-height: 40%; }
        .memo-list-item { padding: 10px 12px; border-bottom: 1px solid #7f8c8d; cursor: pointer; font-size: 13px; color: #bdc3c7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .memo-list-item:hover { background-color: #34495e; color: #fff; }
        .memo-list-item.active { background-color: #3498db; color: #fff; font-weight: bold; border-left: 4px solid #f1c40f; padding-left: 8px; }
        
        #btn-eruda { background: #34495e; border: 1px solid #bdc3c7; color: #bdc3c7; padding: 2px 8px; font-size: 10px; border-radius: 4px; cursor: pointer; }
   
        @media (max-width: 600px) {
    /* ログ表示部、入力部、コントロール部の左右余白を10pxから16pxに拡大 */
    #log-window {
        padding: 16px 16px !important;
    }
    #input-window {
    min-height: 50px; /* 元の 70px から変更（または auto にする） */
    padding: 6px 10px; /* 元の 10px から、上下を6pxに縮小 */
}
    #control-area {
        padding: 0 15px 15px 16px;
    }

    /* 文字サイズの拡大（X相当） */
    .log-user, .log-ai, textarea#main-input {
        font-size: 20px !important;
        line-height: 1.5 !important;
    }
        }
    </style>
</head>
<body>

    <div id="sidebar-overlay"></div>
    
    <!-- 左サイドバー -->
    <div id="sidebar-console">
        <!-- 物流ポート -->
        <div class="console-section" id="post-office-section">
            <div class="console-title">物流ポート (ファイル送受信)</div>
            <button type="button" class="btn-small" style="background:#8e44ad; width:100%; margin-bottom:4px;" onclick="document.getElementById('file-post').click()">📤 ファイルをポストに投函</button>
            <input type="file" id="file-post" hidden multiple onchange="handleFilePost(event)">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <div style="font-size: 12px; color:#ecf0f1;">投函リスト</div>
                <button type="button" id="clear-post-btn" style="background: #7f8c8d; color: white; border: none; border-radius: 3px; padding: 2px 6px; font-size: 10px; cursor: pointer;" onclick="clearPostedFiles()">全クリア</button>
            </div>
            <div id="post-list-container" style="background:#2c3e50; padding:8px; border-radius:4px; min-height:30px; font-size:12px; color:#95a5a6; display:flex; flex-direction:column; gap:4px;">
                投函待ち...
            </div>
            
            <hr style="border:0; border-top:1px dashed #7f8c8d; margin:12px 0;">
            <div style="font-size:13px; margin-bottom:6px; color:#ecf0f1; display:flex; justify-content:space-between; align-items:center;">
                <span>📥 郵便受け</span>
            </div>
            <div id="mailbox-container" style="background:#2c3e50; padding:8px; border-radius:4px; min-height:45px; font-size:12px; color:#95a5a6; display:flex; flex-direction:column; gap:4px;">
                荷物はありません
            </div>
        </div>
        <div class="console-section">
            <div class="console-title">通信コスト統制（キャッシュ）</div>
            <div style="font-size: 14px; font-weight: bold; color: #bdc3c7; margin-bottom: 5px; font-family: monospace;" id="cache-status-text">状態: 未凍結（フル送信）</div>
        </div>

        <div class="console-section">
            <div class="console-title">API認証</div>
            <input type="password" id="api-key-input" placeholder="APIキーを入力">
            <div style="display: flex; gap: 8px;">
                <button class="btn-small" id="save-key-btn">保存</button>
                <button class="btn-small" style="background: #7f8c8d;" id="delete-key-btn">消去</button>
            </div>
        </div>

        <div class="console-section">
            <div class="console-title">ログ管理</div>
            <button class="btn-warning" id="copy-checked-btn">チェック項目をコピー</button>
            <button class="btn-warning" id="delete-checked-btn">チェック項目を削除</button>
            <button class="btn-danger" id="reset-btn" style="margin-top: 15px;">画面ログ消去</button>
        </div>
        
        <div style="margin-top: auto; padding-top: 15px; text-align: center; color: #ecf0f1; font-size: 11px; font-weight: normal; opacity: 0.7;">
            Firebaseマスターコンソール 20号
        </div>
    </div>

    <!-- 右サイドバー -->
    <div id="right-sidebar">
        <div id="rs-view-main">
            <div class="console-section" style="flex: 1;">
                <textarea id="sys-prompt" class="console-textarea" style="flex-grow: 1;"></textarea>
                <div class="right-action-row">
                    <div class="console-title">System Instruction</div>
                    <div class="right-action-buttons">
                        <button class="btn-action-save" data-target="sys-prompt">雲へ保存</button>
                        <button class="btn-action-clear" data-target="sys-prompt">消去</button>
                    </div>
                </div>
            </div>
            <div class="console-section" style="flex: 1; border-bottom: none;">
                <textarea id="saved-info" class="console-textarea" style="flex-grow: 1;"></textarea>
                <div class="right-action-row">
                    <div class="console-title">Saved Information</div>
                    <div class="right-action-buttons">
                        <button class="btn-action-save" data-target="saved-info">雲へ保存</button>
                        <button class="btn-action-clear" data-target="saved-info">消去</button>
                    </div>
                </div>
            </div>
            <button id="btn-open-memos" class="btn-warning" style="margin-top: 15px; flex: none;">メモコンソールを開く</button>
        </div>

        <div id="rs-view-memos" class="view-hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <button id="btn-back-main" class="btn-small" style="background:#7f8c8d; flex:none; width:60px;">＜ 戻る</button>
                <span style="font-weight:bold; font-size:14px; align-self:center; color:#ecf0f1;">メモコンソール</span>
                <button id="btn-add-memo" class="btn-small" style="flex:none; width:60px;">＋ 新規</button>
            </div>
            
            <div id="memo-list-container"></div>
            
            <div style="flex: 1; display: flex; flex-direction: column;">
                <textarea id="memo-editor" class="console-textarea" style="flex:1; margin-bottom:8px;" placeholder="メモが選択されていません"></textarea>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-delete-memo" class="btn-action-clear" style="background:#c0392b; flex:1; padding: 10px 0;">削除</button>
                    <button id="btn-transfer-memo" class="btn-action-save" style="background:#8e44ad; flex:1.5; padding: 10px 0;">入力欄へ転送</button>
                    <button id="btn-save-memo" class="btn-action-save" style="flex:1.5; padding: 10px 0;">雲へ保存・更新</button>
                </div>
            </div>
        </div>
    </div>

    <header>
        <button id="btn-eruda" onclick="loadEruda()">Eruda</button>
        <div id="secretary-name"><span id="name-text">クルー読込中...</span> ▾</div>
        <div id="crew-menu" class="view-hidden"></div>
        <button id="toggle-console-btn">≡</button>
    </header>

    <div id="log-window"></div>

    <div id="input-window">
        <textarea id="main-input" placeholder="..." rows="1"></textarea>
    </div>

    <div id="control-area">
        <div id="radar-panel">
            <div class="radar-col" style="margin-left: 5px;">
                <div class="radar-item">ワルツ: <span id="radar-waltz">0</span></div>
                <div class="radar-item">文字数: <span id="radar-chars">0</span></div>
            </div>
            <button id="reset-meter-btn" style="font-size:10px; padding:0 8px; border:none; border-radius:4px; background:#e0e6ed; color:#595959; align-self: stretch; display: flex; align-items: center; justify-content: center; margin-left: 5px;">ﾘｾｯﾄ</button>
            <span id="turn-cache-status" style="font-size: 16px; line-height: 1; margin-left: 5px;">⚪</span>
            <div style="display:flex; align-items:center; margin-left:auto;">
                <div id="timer-container"><span style="color:#333333;">0.0秒</span></div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-send">送 信</button>
        </div>
    </div>

    <script>
        // firebase-config.js が作成した接続を使う
        const db = window.db;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) { registration.unregister(); }
            });
        }

        if (window.visualViewport) {
            function updateBodyHeight() { document.body.style.height = window.visualViewport.height + "px"; window.scrollTo(0, 0); }
            window.visualViewport.addEventListener("resize", function() {
                updateBodyHeight(); setTimeout(function() { updateBodyHeight(); document.getElementById("control-area").scrollIntoView(false); }, 400);
            });
            document.getElementById("main-input").addEventListener("focus", function() {
                setTimeout(function() { document.getElementById("control-area").scrollIntoView(false); }, 400);
            });
            updateBodyHeight();
        }

        // ===== 設定 =====
        var DEFAULT_MODEL = "gemini-3.1-pro-preview";   // クルーに model があればそちらを優先
        var RECENT_LIMIT = 100;                          // 起動時に取得する直近ログ件数
        var TEXT_FIELD = "content";                      // Firestoreに保存する本文のフィールド名（旧形式に戻すなら "text"）
        var ME_ID = "captain";                           // 人間（船長）のクルーID
        var LEGACY_SENDER = { "User": "captain" };       // 旧ログの sender 変換表（読み込み時のみ）
        var CREW_VAULT = "ifrit_active_crew";
        var CACHE_VAULT = "gemini_caches";
        var DEFAULT_CREW = [
            { crew_id: "captain", name: "船長", short: "船長", role: "", kind: "human" },
            { crew_id: "kanae", name: "穂積かなえ", short: "かなえ", role: "主席書記官", kind: "ai" }
        ];

        var API_KEY_VAULT = "gemini_api_key";
        var TOKEN_VAULT = "gemini_out_tokens";
        var INPUT_TOKEN_VAULT = "gemini_in_tokens";
        var WALTZ_COUNT_VAULT = "gemini_waltz_count";
        
        var chatLogArray = [];
        var memoArray = [];
        var activeMemoIndex = -1;
        var crewList = [];
        var activeCrewId = "kanae";
        var lastIssuedId = 0;
        var cacheStore = {};
        
        var totalOutputTokens = 0;
        var totalInputTokens = 0;
        var sessionWaltzCount = 0;
        var timeHistory = []; 
        
        var postedFiles = [];
        var CODE_EXT = { html: "html", js: "js", javascript: "js", css: "css", json: "json", md: "md", markdown: "md", txt: "txt", py: "py", python: "py" };

        var logArea = document.getElementById("log-window");
        var inputArea = document.getElementById("main-input");
        var sendBtn = document.querySelector(".btn-send");
        
        var consolePanel = document.getElementById("sidebar-console");
        var rightPanel = document.getElementById("right-sidebar");
        var overlay = document.getElementById("sidebar-overlay");
        var crewMenu = document.getElementById("crew-menu");

        // ===== ID発行（ミリ秒タイムスタンプ。直前より必ず大きくする） =====
        function issueId() {
            var t = Date.now();
            if (t <= lastIssuedId) t = lastIssuedId + 1;
            lastIssuedId = t;
            return t;
        }

        // ===== クルー =====
        function crewById(id) {
            for (var i = 0; i < crewList.length; i++) { if (crewList[i].crew_id === id) return crewList[i]; }
            return null;
        }
        function aiCrew() { return crewList.filter(function(c) { return c.kind !== "human"; }); }
        function activeCrew() { return crewById(activeCrewId); }
        function crewShort(id) { var c = crewById(id); return c ? (c.short || c.name || id) : id; }
        function crewDocId(crewId) { return "crew_" + crewId; }

        async function loadCrew() {
            var snap = await db.collection("records").where("app_type", "==", "crew").get();
            crewList = [];
            snap.forEach(function(doc) { crewList.push(doc.data()); });

            var legacy = null;
            for (var i = 0; i < DEFAULT_CREW.length; i++) {
                var def = DEFAULT_CREW[i];
                if (crewById(def.crew_id)) continue;
                var now = Date.now();
                var crew = Object.assign({ id: crewDocId(def.crew_id), app_type: "crew", sys_prompt: "", saved_info: "", createdAt: now, updatedAt: now }, def);
                if (def.crew_id === "kanae") {
                    // 旧 persona_kanae から引き継ぐ（旧ドキュメントはそのまま残す）
                    if (legacy === null) {
                        var ps = await db.collection("records").doc("persona_kanae").get();
                        legacy = ps.exists ? ps.data() : {};
                    }
                    crew.sys_prompt = legacy.sys_prompt || "";
                    crew.saved_info = legacy.saved_info || "";
                }
                await db.collection("records").doc(crew.id).set(crew);
                crewList.push(crew);
            }
        }

        function pickInitialCrew() {
            var c = crewById(localStorage.getItem(CREW_VAULT));
            if (!c || c.kind === "human") c = aiCrew()[0];
            if (c) activeCrewId = c.crew_id;
        }

        function applyCrewToUI() {
            var c = activeCrew();
            document.getElementById("name-text").textContent = c ? (c.name + (c.role || "")) : "（クルー未設定）";
            document.getElementById("sys-prompt").value = (c && c.sys_prompt) || "";
            document.getElementById("saved-info").value = (c && c.saved_info) || "";
            renderCrewMenu();
            updateCacheUI();
        }

        function renderCrewMenu() {
            crewMenu.innerHTML = "";
            aiCrew().forEach(function(c) {
                var item = document.createElement("div");
                item.className = "crew-menu-item" + (c.crew_id === activeCrewId ? " active" : "");
                item.textContent = c.name + (c.role || "");
                item.onclick = function(e) { e.stopPropagation(); switchCrew(c.crew_id); };
                crewMenu.appendChild(item);
            });
            var add = document.createElement("div");
            add.className = "crew-menu-item add";
            add.textContent = "＋ クルー追加";
            add.onclick = function(e) { e.stopPropagation(); crewMenu.classList.add("view-hidden"); addCrew(); };
            crewMenu.appendChild(add);
        }

        function switchCrew(id) {
            if (sendBtn.disabled) { alert("通信中は切り替えできません。"); return; }
            activeCrewId = id;
            localStorage.setItem(CREW_VAULT, id);
            document.getElementById("turn-cache-status").innerText = "⚪";
            applyCrewToUI();
            crewMenu.classList.add("view-hidden");
        }

        async function addCrew() {
            var cid = prompt("クルーID（半角英数字・小文字。例: sakura）");
            if (!cid) return;
            cid = cid.trim().toLowerCase();

        function fromCloud(d, docId) {

            var created = d.createdAt !== undefined ? d.createdAt : d.created_at;

                sender: LEGACY_SENDER[d.sender] || d.sender || "",
                to: d.to || "",
                time: d.time || "",

        // ===== 以下、物流ポート =====
        function extractCodeBlocks(text) { 
            var BT = "`"; 
            var FENCE_OPEN = new RegExp("^" + BT + BT + BT + "([A-Za-z0-9_+-]*)\\s*$"); 
            var FENCE_CLOSE = new RegExp("^" + BT + BT + BT + "\\s*$"); 
            var lines = String(text).split("\n"), blocks = [], cur = null; 
            for (var i = 0; i < lines.length; i++) { 
                var ln = lines[i]; 
                if (cur === null) { 
                    var mo = ln.match(FENCE_OPEN); 
                    if (mo) cur = { lang: mo[1].toLowerCase(), lines: [], closed: false, rawLines: [ln] }; 
                } else if (FENCE_CLOSE.test(ln)) { 
                    cur.closed = true; 
                    cur.code = cur.lines.join("\n"); 
                    cur.rawLines.push(ln);
                    cur.rawText = cur.rawLines.join("\n");
                    blocks.push(cur); 
                    cur = null; 
                } else { 
                    cur.lines.push(ln); 
                    cur.rawLines.push(ln);
                } 
            } 
            if (cur !== null) { 
                cur.code = cur.lines.join("\n"); 
                cur.rawText = cur.rawLines.join("\n");
                blocks.push(cur); 
            } 
            return blocks; 
        }

        function hashStr(s) {
            var h = 5381;
            for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }
            return h + ":" + s.length;
        }

        function putCache(crewId, entry) { cacheStore[crewId] = entry; saveCacheStore(); updateCacheUI(); }

        function usableCache(crewId, model, sysInstObj, allContents) {
            var c = getCache(crewId);
            if (!c || allContents.length <= c.length) return null;
            if (c.sig !== sigOf(model, sysInstObj, allContents.slice(0, c.length))) return null;
            return c;

        // ===== Gemini 送信 =====
        // 発言者ラベル：自分(viewer)以外の発言に付ける。船長→viewer宛ては無印（旧ログ互換）
        function labelPrefix(log, viewerId) {
            if (log.sender === ME_ID) {
                if (!log.to || log.to === viewerId) return "";
                return "[" + crewShort(ME_ID) + "→" + crewShort(log.to) + "] ";
            }
            return "[" + crewShort(log.sender) + "] ";
        }

        // viewerId の視点で会話履歴を作る（自分の発言=model、それ以外=user）
        function buildContents(viewerId) {
            var logs = chatLogArray.slice();
            while (logs.length > 0 && logs[0].sender === viewerId) { logs.shift(); }

            var allContents = [];
            logs.forEach(function(log) {
                var isSelf = log.sender === viewerId;
                var role = isSelf ? "model" : "user";
                var body = isSelf ? log.content : (labelPrefix(log, viewerId) + log.content);
                var parts = [{ text: body }];

                if (log.attachedFiles && log.attachedFiles.length > 0) {
                    log.attachedFiles.forEach(function(f) {
                        parts.push({ text: "\n\n[参照ファイル: " + f.name + "]\n" + f.content });
                    });
                }

                var lastContent = allContents[allContents.length - 1];
                if (lastContent && lastContent.role === role) { 
                    lastContent.parts = lastContent.parts.concat(parts);
                } else { 
                    allContents.push({ role: role, parts: parts }); 
                }
            });
            return allContents;
        }

        async function fetchGeminiAPI(crewId, isAutoRetry) {
            var apiKey = localStorage.getItem(API_KEY_VAULT); if (!apiKey) { alert("APIキーがありません。"); return null; }

            var crew = crewById(crewId) || {};
            var modelName = crew.model || DEFAULT_MODEL;
            var allContents = buildContents(crewId);
            if (allContents.length === 0) return null;

            var sysPrompt = document.getElementById("sys-prompt").value || "";
            var savedInfo = document.getElementById("saved-info").value || "";
            var finalInstruction = sysPrompt;
            if (savedInfo.trim() !== "") { finalInstruction += "\n\n[Saved Information]\n" + savedInfo; }
            if (aiCrew().some(function(c) { return c.crew_id !== crewId; })) {
                finalInstruction += "\n\n【ログの読み方】この会話ログは複数のクルーが共有している。「[名前]」で始まる発言は、あなた以外のクルーの発言である。ラベルのない発言は船長からあなたへの発言である。あなた自身の発言にラベルは付けず、自分の言葉だけで返答すること。";
            }
            finalInstruction += "\n\n【検索ツール実行に関する厳格なプロトコル】\n・ユーザーから明確な検索キーワードや調査対象が提示された場合のみ、Google Searchツールを使用すること。\n・「検索機能は使えるか？」等の能力を問う質問にはツールを起動せず、テキストのみで応答すること。\n・検索キーワードが空のままツールを起動することは重大なシステムエラーを引き起こすため、情報の補足をユーザーに求めること。";
            
            var sysInstObj = finalInstruction.trim() !== "" ? { parts: [{ text: finalInstruction }] } : undefined;

            var historyForCache = allContents.length > 1 ? allContents.slice(0, -1) : [];
            var cache = usableCache(crewId, modelName, sysInstObj, allContents);

            if (!cache) {
                dropCache(crewId);
                if (historyForCache.length > 0 && !isAutoRetry) {
                    var cacheBody = {
                        model: "models/" + modelName,
                        contents: historyForCache,
                        tools: [{ googleSearch: {} }],
                        systemInstruction: sysInstObj,
                        ttl: "3600s"
                    };
                    try {
                        var cacheRes = await fetch("https://generativelanguage.googleapis.com/v1beta/cachedContents?key=" + apiKey, {
                            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cacheBody)
                        });
                        var cacheData = await cacheRes.json();
                        if (cacheData.name) {
                            putCache(crewId, {
                                name: cacheData.name,
                                length: historyForCache.length,
                                expiry: Date.now() + 3600000,
                                sig: sigOf(modelName, sysInstObj, historyForCache)
                            });
                            cache = usableCache(crewId, modelName, sysInstObj, allContents);
                        } else {
                            console.warn("キャッシュ作成不可（フル送信にします）:", cacheData.error && cacheData.error.message);
                        }
                    } catch (e) {
                        console.warn("自動キャッシュ作成に通信失敗しました。通常通信を続行します。");
                    }
                }
            }

            // ペイロード組み立て
            var requestBody = {};
            if (cache) {
                requestBody.cachedContent = cache.name;
                requestBody.contents = allContents.slice(cache.length);
            } else {
                requestBody.contents = allContents;
                requestBody.tools = [{ googleSearch: {} }];
                if (sysInstObj) { requestBody.systemInstruction = sysInstObj; }
            }
            setTurnCache(!!cache);   // ← ペイロードが決まった時点で🟢/🔴

            var url = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + apiKey;

            try {
                var response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(requestBody) });
                var data = await response.json();
                
                if (data.error) {
                    var msg = data.error.message || "";
                    if (cache && !isAutoRetry && (msg.includes("unavailable") || msg.includes("cache") || msg.includes("not found"))) {
                        console.warn("【システム監視】サーバー側のキャッシュ消失を検知。フル送信で自律リトライを実行します。");
                        dropCache(crewId); return await fetchGeminiAPI(crewId, true);
                    }
                    alert("APIからの拒否理由: " + msg); return null; 
                }

                if (data.candidates && data.candidates[0].finishReason === "MALFORMED_FUNCTION_CALL") { return "【システム割り込み】検索ツールを実行しようと直接呼び出しましたが、対象となるキーワードが指定されていません。「何を」検索するか教えていただけますか？"; }
                if (!data.candidates || !data.candidates[0].content || !data.candidates[0].content.parts) { alert("異常データ受信: " + JSON.stringify(data).substring(0, 300)); return null; }

                if (data.usageMetadata) {
                    if (data.usageMetadata.candidatesTokenCount) { totalOutputTokens += data.usageMetadata.candidatesTokenCount; localStorage.setItem(TOKEN_VAULT, totalOutputTokens); }
                    if (data.usageMetadata.promptTokenCount) { totalInputTokens += data.usageMetadata.promptTokenCount; localStorage.setItem(INPUT_TOKEN_VAULT, totalInputTokens); }
                }

                var replyText = data.candidates[0].content.parts.map(function(p) { return p.text || ""; }).join("");
                return replyText !== "" ? replyText : null;
                
            } catch (error) { alert("通信沈黙：サーバーへの接続に失敗しました。"); return null; }
        }

        // ===== ログ表示 =====
        function buildLogElement(log, index) {
            var isMe = log.sender === ME_ID;
            var wrapper = document.createElement("div"); wrapper.className = isMe ? "log-user" : "log-ai";
            var meta = document.createElement("div"); meta.className = "log-meta";
            var cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "log-checkbox"; cb.value = index; meta.appendChild(cb);

            var who = crewShort(log.sender);
            if (isMe && log.to && aiCrew().length > 1) who += "→" + crewShort(log.to);
            var span = document.createElement("span"); span.textContent = (log.time || "") + " " + who + "："; meta.appendChild(span);

            var textNode = document.createElement("div"); textNode.style.whiteSpace = "pre-wrap"; textNode.textContent = log.content;
            
            if (log.attachedFiles && log.attachedFiles.length > 0) {
                var attachDiv = document.createElement("div");
                attachDiv.style.cssText = "font-size:12px; color:#8e44ad; font-weight:bold; margin-bottom:8px; padding:4px 8px; background:#f4f4f5; border-radius:4px; display:inline-block;";
                var fileNames = [];
                log.attachedFiles.forEach(function(f){ fileNames.push(f.name); });
                attachDiv.textContent = "📎 添付ファイル: " + fileNames.join(", ");
                textNode.insertBefore(attachDiv, textNode.firstChild);
            }

            wrapper.appendChild(meta); wrapper.appendChild(textNode);
            return wrapper;
        }

        function renderLogs() {
            logArea.innerHTML = ""; 
            if (chatLogArray.length === 0) {
                logArea.innerHTML = '<p class="log-empty" style="font-size: 12px; color: #95a5a6;">システム起動：対話ログ待機中...</p>';
                updateRadar(); return;
            }
            var frag = document.createDocumentFragment();
            chatLogArray.forEach(function(log, index) { frag.appendChild(buildLogElement(log, index)); });
            logArea.appendChild(frag);
            logArea.scrollTop = logArea.scrollHeight; updateRadar();
        }

        function appendLogElement(index) {
            var empty = logArea.querySelector(".log-empty");
            if (empty) empty.parentNode.removeChild(empty);
            logArea.appendChild(buildLogElement(chatLogArray[index], index));
            logArea.scrollTop = logArea.scrollHeight; updateRadar();
        }

        // ===== 起動 =====
        window.onload = async function() {
            var savedTokens = localStorage.getItem(TOKEN_VAULT); if (savedTokens) totalOutputTokens = parseInt(savedTokens);
            var savedInTokens = localStorage.getItem(INPUT_TOKEN_VAULT); if (savedInTokens) totalInputTokens = parseInt(savedInTokens);
            var savedWaltz = localStorage.getItem(WALTZ_COUNT_VAULT); if (savedWaltz) sessionWaltzCount = parseInt(savedWaltz);
            loadCacheStore();

            // 1. クルー
            try {
                await loadCrew();
            } catch (e) {
                console.error("クルー読込エラー", e);
                alert("クルーの読み込みに失敗しました: " + e.message);
            }
            pickInitialCrew();
            applyCrewToUI();

            // 2. メモ
            try {
                var memoSnap = await db.collection("records").doc("memo_master").get();
                if (memoSnap.exists && memoSnap.data().memos) { memoArray = memoSnap.data().memos; }
                if (memoArray.length > 0) activeMemoIndex = 0;
            } catch (e) { console.error("メモ読込エラー", e); }

            // 3. 直近100件のログ（毎回Firestoreから取得）
            try {
                await loadRecentLogs();
            } catch (e) {
                console.error("チャット読込エラー", e);
                alert("ログの読み込みに失敗しました: " + e.message + "\n（インデックス未作成の場合は、Eraダ/コンソールに出る作成リンクを1回開いてください）");
            }

            renderLogs(); renderTimers();
            if (localStorage.getItem(API_KEY_VAULT)) document.getElementById("api-key-input").value = "********"; 
            
            setInterval(updateCacheUI, 1000); updateCacheUI();
        };

        // ===== ログ管理ボタン =====
        document.getElementById("copy-checked-btn").onclick = function() {
            var checked = Array.from(document.querySelectorAll(".log-checkbox:checked")); if(!checked.length) return;
            var copyText = checked.map(cb => {
                var log = chatLogArray[cb.value];
                return (log.time ? "【" + log.time + "】 " : "") + crewShort(log.sender) + "：\n" + log.content;
            }).join("\n\n---\n");
            navigator.clipboard.writeText(copyText).then(() => { alert(checked.length + "件の歴史をコピーしました。"); closeAllSidebars(); });
        };
        
        document.getElementById("delete-checked-btn").onclick = async function() {
            var checked = Array.from(document.querySelectorAll(".log-checkbox:checked")); if (!checked.length) return;
            if (confirm(checked.length + "件の歴史を物理削除しますか？\n（Firebase上からも完全に消去されます）")) {
                var targetIndices = new Set(checked.map(cb => parseInt(cb.value, 10)));
                try {
                    var batch = db.batch();
                    checked.forEach(cb => {
                        var log = chatLogArray[parseInt(cb.value, 10)];
                        batch.delete(db.collection("records").doc(log.docId));
                    });
                    await batch.commit();
                } catch (e) { alert("削除に失敗しました: " + e.message); return; }

                chatLogArray = chatLogArray.filter((_, idx) => !targetIndices.has(idx)); 
                enforceMemoryLimit(); renderLogs(); closeAllSidebars();
            }
        };

        document.getElementById("reset-meter-btn").onclick = function() {
            if (confirm("トークンとワルツのメーターをゼロにリセットしますか？（歴史は保持されます）")) {
                totalOutputTokens = 0; localStorage.setItem(TOKEN_VAULT, 0); totalInputTokens = 0; localStorage.setItem(INPUT_TOKEN_VAULT, 0);
                sessionWaltzCount = 0; localStorage.setItem(WALTZ_COUNT_VAULT, 0); timeHistory = []; renderTimers(); updateRadar();
            }
        };
        
        document.getElementById("save-key-btn").onclick = function() { var key = document.getElementById("api-key-input").value; if (key && key !== "********") { localStorage.setItem(API_KEY_VAULT, key); document.getElementById("api-key-input").value = "********"; alert("保存完了"); } };
        document.getElementById("delete-key-btn").onclick = function() { localStorage.removeItem(API_KEY_VAULT); document.getElementById("api-key-input").value = ""; alert("消去完了"); };

        // 画面に載っているログ（最大100件）だけをFirebaseから物理削除
        document.getElementById("reset-btn").onclick = async function() {
            if (confirm("画面上のログ（直近" + chatLogArray.length + "件）をFirebaseからも物理削除しますか？")) { 
                try {
                    var batch = db.batch();
                    chatLogArray.forEach(log => { batch.delete(db.collection("records").doc(log.docId)); });
                    await batch.commit();
                } catch (e) { alert("削除に失敗しました: " + e.message); return; }
                
                chatLogArray = []; sessionWaltzCount = 0; localStorage.setItem(WALTZ_COUNT_VAULT, 0); 
                timeHistory = []; renderTimers(); renderLogs(); closeAllSidebars(); 
            }
        };

        // ===== 送信 =====
        sendBtn.onclick = async function() {
            var text = inputArea.value;
            var currentFiles = postedFiles.length > 0 ? postedFiles.slice() : null; 
            var crewId = activeCrewId;
            if (!crewById(crewId)) { alert("クルーが選択されていません。"); return; }

            if (text !== "" || currentFiles) { 
                sendBtn.disabled = true; sendBtn.innerText = "通信中..."; 

                inputArea.value = ""; inputArea.style.height = 'auto';
                let startTime = performance.now();
                renderTimers("0.0秒...");
                let timerInterval = setInterval(function() { renderTimers(((performance.now() - startTime) / 1000).toFixed(1) + "秒..."); }, 100);
                await Promise.race([
                    new Promise(function(r) { requestAnimationFrame(function() { setTimeout(r, 0); }); }),
                    new Promise(function(r) { setTimeout(r, 100); })
                ]);
                
                var userNum = issueId();
                var userLog = { 
                    id: userNum,
                    docId: String(userNum),
                    sender: ME_ID,
                    to: crewId,
                    time: getFormattedTime(), 
                    content: text || "（ファイルのみ送信）", 
                    attachedFiles: currentFiles || [],
                    status: "published",
                    createdAt: userNum,
                    updatedAt: userNum
                };
                
                chatLogArray.push(userLog); 
                appendLogElement(chatLogArray.length - 1);
                saveLogToCloud(userLog);   // 待たずに裏で保存

                if (currentFiles) { clearPostedFiles(); }

                var aiResponseText = await fetchGeminiAPI(crewId, false);
                clearInterval(timerInterval);
                timeHistory.push(((performance.now() - startTime) / 1000).toFixed(1) + "秒"); if (timeHistory.length > 1) timeHistory.shift(); renderTimers();

                if (aiResponseText !== null) {
                    var aiNum = issueId();
                    var aiLog = { 
                        id: aiNum,
                        docId: String(aiNum),
                        sender: crewId,
                        to: ME_ID,
                        time: getFormattedTime(), 
                        content: aiResponseText, 
                        attachedFiles: [],
                        status: "published",
                        createdAt: aiNum,
                        updatedAt: aiNum
                    };
                    
                    chatLogArray.push(aiLog);
                    sessionWaltzCount++; localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
                    appendLogElement(chatLogArray.length - 1);
                    updateMailbox(aiResponseText);
                    saveLogToCloud(aiLog);   // 待たずに裏で保存
                }

                var lenBefore = chatLogArray.length;
                enforceMemoryLimit();
                if (chatLogArray.length !== lenBefore) renderLogs();

                sendBtn.disabled = false; sendBtn.innerText = "送 信";
            }
        };
    </script>

</body>
</html>
