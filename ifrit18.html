    <script>
        // ▼ Firebaseの初期化 (船長のConfig)
        const firebaseConfig = {
            apiKey: "AIzaSyAlz26igDEILsZBL5LrVVynx6KlsKu6e8U",
            authDomain: "sneezer31-78845.firebaseapp.com",
            projectId: "sneezer31-78845",
            storageBucket: "sneezer31-78845.firebasestorage.app",
            messagingSenderId: "1094107940035",
            appId: "1:1094107940035:web:2f5cfbcccf313feac7ce76"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
      db.settings({ experimentalForceLongPolling: true });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) { registration.unregister(); }
            });
        }

        if (window.visualViewport) {
            function updateBodyHeight() { document.body.style.height = window.visualViewport.height + "px"; window.scrollTo(0, 0); }
            window.visualViewport.addEventListener("resize", function() {
                updateBodyHeight(); setTimeout(function() { updateBodyHeight(); document.getElementById("control-area").scrollIntoView(false); }, 400);
            });
            document.getElementById("main-input").addEventListener("focus", function() {
                setTimeout(function() { document.getElementById("control-area").scrollIntoView(false); }, 400);
            });
            updateBodyHeight();
        }

        var API_KEY_VAULT = "gemini_api_key";
        var TOKEN_VAULT = "gemini_out_tokens";
        var INPUT_TOKEN_VAULT = "gemini_in_tokens";
        var WALTZ_COUNT_VAULT = "gemini_waltz_count";
        
        var chatLogArray = [];
        var memoArray = [];
        var activeMemoIndex = -1;
        
        var totalOutputTokens = 0;
        var totalInputTokens = 0;
        var sessionWaltzCount = 0;
        var timeHistory = []; 
        
        var postedFiles = [];
        var CODE_EXT = { html: "html", js: "js", javascript: "js", css: "css", json: "json", md: "md", markdown: "md", txt: "txt", py: "py", python: "py" };
        
        function extractCodeBlocks(text) { 
            var BT = "`"; 
            var FENCE_OPEN = new RegExp("^" + BT + BT + BT + "([A-Za-z0-9_+-]*)\\s*$"); 
            var FENCE_CLOSE = new RegExp("^" + BT + BT + BT + "\\s*$"); 
            var lines = String(text).split("\n"), blocks = [], cur = null; 
            for (var i = 0; i < lines.length; i++) { 
                var ln = lines[i]; 
                if (cur === null) { 
                    var mo = ln.match(FENCE_OPEN); 
                    if (mo) cur = { lang: mo[1].toLowerCase(), lines: [], closed: false, rawLines: [ln] }; 
                } else if (FENCE_CLOSE.test(ln)) { 
                    cur.closed = true; 
                    cur.code = cur.lines.join("\n"); 
                    cur.rawLines.push(ln);
                    cur.rawText = cur.rawLines.join("\n");
                    blocks.push(cur); 
                    cur = null; 
                } else { 
                    cur.lines.push(ln); 
                    cur.rawLines.push(ln);
                } 
            } 
            if (cur !== null) { 
                cur.code = cur.lines.join("\n"); 
                cur.rawText = cur.rawLines.join("\n");
                blocks.push(cur); 
            } 
            return blocks; 
        }
        
        function downloadText(name, content) { var url = URL.createObjectURL(new Blob([content], { type: "text/plain;charset=utf-8" })); var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function() { URL.revokeObjectURL(url); }, 1000); }
        
        function renderPostList() {
            var container = document.getElementById("post-list-container");
            container.innerHTML = "";
            if (postedFiles.length === 0) {
                container.innerHTML = "投函待ち...";
                return;
            }
            postedFiles.forEach(function(f, index) {
                var div = document.createElement("div");
                div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#34495e; padding:4px 8px; border-radius:3px;";
                var nameSpan = document.createElement("span");
                nameSpan.style.cssText = "white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:85%; color:#f1c40f;";
                nameSpan.textContent = "📄 " + f.name;
                var delBtn = document.createElement("button");
                delBtn.style.cssText = "background:#c0392b; color:white; border:none; border-radius:3px; width:20px; height:20px; display:flex; justify-content:center; align-items:center; cursor:pointer;";
                delBtn.textContent = "✖";
                delBtn.onclick = function() { postedFiles.splice(index, 1); renderPostList(); };
                div.appendChild(nameSpan); div.appendChild(delBtn); container.appendChild(div);
            });
        }

        function handleFilePost(e) { 
            var files = e.target.files; 
            if (!files || files.length === 0) return; 
            var loadedCount = 0;
            for(var i = 0; i < files.length; i++) {
                (function(file) {
                    var reader = new FileReader(); 
                    reader.onload = function() { 
                        postedFiles.push({ name: file.name, content: String(reader.result) }); 
                        loadedCount++;
                        if (loadedCount === files.length) { renderPostList(); e.target.value = ""; }
                    }; 
                    reader.readAsText(file);
                })(files[i]);
            }
        }

        function clearPostedFiles() { postedFiles = []; renderPostList(); document.getElementById("file-post").value = ""; }

        function updateMailbox(aiText) { 
            var blocks = extractCodeBlocks(aiText); 
            var container = document.getElementById("mailbox-container"); 
            container.innerHTML = ""; 
            if (blocks.length === 0) { container.innerHTML = "荷物はありません"; return; } 
            
            blocks.forEach(function(b, bi) { 
                var codeLines = b.code.split("\n"); 
                var fileName = null; 
                var fm = (codeLines[0] || "").match(/FILE:\s*([^\s>*]+)/); 
                var body = b.code; 
                if (fm) { fileName = fm[1]; body = codeLines.slice(1).join("\n"); } 
                else { fileName = "received_" + getFormattedTime().replace(/[^0-9]/g, "") + "_" + (bi + 1) + "." + (CODE_EXT[b.lang] || "txt"); } 
                
                var wrapper = document.createElement("div");
                wrapper.style.cssText = "display:flex; gap:4px; margin-bottom:4px;";
                var btnDL = document.createElement("button"); 
                btnDL.className = "btn-small"; 
                btnDL.style.cssText = "flex:1; text-align:left; padding:8px; background:#27ae60; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"; 
                btnDL.textContent = "📦 " + fileName; 
                btnDL.disabled = !b.closed; 
                if (!b.closed) { btnDL.style.background = "#c0392b"; btnDL.textContent = "⚠ [破損] " + fileName; } 
                btnDL.onclick = function() { downloadText(fileName, body); }; 
                
                var btnPurge = document.createElement("button");
                btnPurge.className = "btn-small";
                btnPurge.style.cssText = "flex:none; width:40px; background:#e67e22; padding:8px 0; display:flex; justify-content:center; align-items:center; font-size:16px;";
                btnPurge.innerHTML = "✂️";
                btnPurge.title = "DL ＆ ログからパージ";
                btnPurge.disabled = !b.closed;
                btnPurge.onclick = function() {
                    if(confirm("【抽出＆パージ】\nこのファイルをダウンロードし、会話履歴からこのコード部分を消去しますか？")) {
                        downloadText(fileName, body);
                        purgeCodeFromLog(b.rawText);
                        wrapper.parentNode.removeChild(wrapper);
                        if(container.children.length === 0) container.innerHTML = "荷物はありません";
                    }
                };
                wrapper.appendChild(btnDL); wrapper.appendChild(btnPurge); container.appendChild(wrapper); 
            }); 
        }

        async function purgeCodeFromLog(rawTextToReplace) {
            var purged = false;

        async function fetchGeminiAPI(isAutoRetry = false) {
            var apiKey = localStorage.getItem(API_KEY_VAULT); if (!apiKey) { alert("APIキーがありません。"); return null; }

            // ▼パッチ適用: APIペイロード作成を画面表示中の現役ログから抽出
            var sendLogs = chatLogArray.slice();
            while (sendLogs.length > 0 && sendLogs[0].sender !== "User") { sendLogs.shift(); }
            if (sendLogs.length === 0) return null;

            var allContents = [];
            sendLogs.forEach(function(log) {
                var role = log.sender === "User" ? "user" : "model";
                var parts = [{ text: log.text }];
                
                if (log.attachedFiles && log.attachedFiles.length > 0) {
                    log.attachedFiles.forEach(function(f) {
                        parts.push({ text: "\n\n[参照ファイル: " + f.name + "]\n" + f.content });
                    });
                }

                var lastContent = allContents[allContents.length - 1];
                if (lastContent && lastContent.role === role) { 
                    lastContent.parts = lastContent.parts.concat(parts);
                } else { 
                    allContents.push({ role: role, parts: parts }); 
                }
            });

            var sysPrompt = document.getElementById("sys-prompt").value || "";
            var savedInfo = document.getElementById("saved-info").value || "";
            var finalInstruction = sysPrompt;
            if (savedInfo.trim() !== "") { finalInstruction += "\n\n[Saved Information]\n" + savedInfo; }
            finalInstruction += "\n\n【検索ツール実行に関する厳格なプロトコル】\n・ユーザーから明確な検索キーワードや調査対象が提示された場合のみ、Google Searchツールを使用すること。\n・「検索機能は使えるか？」等の能力を問う質問にはツールを起動せず、テキストのみで応答すること。\n・検索キーワードが空のままツールを起動することは重大なシステムエラーを引き起こすため、情報の補足をユーザーに求めること。";
            
            var sysInstObj = finalInstruction.trim() !== "" ? { parts: [{ text: finalInstruction }] } : undefined;

            var historyForCache = allContents.length > 1 ? allContents.slice(0, -1) : [];
            
            if ((!activeCacheName || activeCacheExpiry <= Date.now() || allContents.length < activeCacheLength) && historyForCache.length > 0 && !isAutoRetry) {
                let cacheBody = {
                    model: "models/gemini-3.1-pro-preview",
                    contents: historyForCache,
                    tools: [{ googleSearch: {} }],
                    systemInstruction: sysInstObj,
                    ttl: "3600s"
                };
                try {
                    let cacheRes = await fetch("https://generativelanguage.googleapis.com/v1beta/cachedContents?key=" + apiKey, {
                        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cacheBody)
                    });
                    let cacheData = await cacheRes.json();
                    if (cacheData.name) {
                        activeCacheName = cacheData.name;
                        activeCacheExpiry = Date.now() + 3600000;
                        activeCacheLength = historyForCache.length;
                        localStorage.setItem("gemini_cache_name", activeCacheName);
                        localStorage.setItem("gemini_cache_expiry", activeCacheExpiry);
                        localStorage.setItem("gemini_cache_length", activeCacheLength);
                    }
                } catch (e) {
                    console.warn("自動キャッシュ作成に通信失敗しました。通常通信を続行します。");
                }
            }

            var requestBody = {};

            if (activeCacheName && activeCacheExpiry > Date.now() && allContents.length > activeCacheLength) {
                requestBody.cachedContent = activeCacheName;
                requestBody.contents = allContents.slice(activeCacheLength);
            } else {
                activeCacheName = null;
                updateCacheUI();
                requestBody.contents = allContents;
                requestBody.tools = [{ googleSearch: {} }];
                if (sysInstObj) { requestBody.systemInstruction = sysInstObj; }
            }

            var url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=" + apiKey;

            try {
                var response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(requestBody) });
                var data = await response.json();
                
                if (data.error) {
                    if (activeCacheName && !isAutoRetry && (data.error.message.includes("unavailable") || data.error.message.includes("cache") || data.error.message.includes("not found"))) {
                        console.warn("【システム監視】サーバー側のキャッシュ消失を検知。フル送信で自律リトライを実行します。");
                        activeCacheName = null; updateCacheUI(); return await fetchGeminiAPI(true);
                    }
                    alert("APIからの拒否理由: " + data.error.message); return null; 
                }

                if (data.candidates && data.candidates[0].finishReason === "MALFORMED_FUNCTION_CALL") { return "【システム割り込み】検索ツールを実行しようと直接呼び出しましたが、対象となるキーワードが指定されていません。「何を」検索するか教えていただけますか？"; }
                if (!data.candidates || !data.candidates[0].content || !data.candidates[0].content.parts) { alert("異常データ受信: " + JSON.stringify(data).substring(0, 300)); return null; }            

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    if (data.usageMetadata) {
                        if (data.usageMetadata.candidatesTokenCount) { totalOutputTokens += data.usageMetadata.candidatesTokenCount; localStorage.setItem(TOKEN_VAULT, totalOutputTokens); }
                        if (data.usageMetadata.promptTokenCount) { totalInputTokens += data.usageMetadata.promptTokenCount; localStorage.setItem(INPUT_TOKEN_VAULT, totalInputTokens); }

                        var turnCacheHit = data.usageMetadata.cachedContentTokenCount || 0;
                        var turnStatusEl = document.getElementById("turn-cache-status");
                        if (turnStatusEl) {
                            if (turnCacheHit > 0) { turnStatusEl.innerText = "🟢"; } else { turnStatusEl.innerText = "🔴"; }
                        }
                    }
                    return data.candidates[0].content.parts[0].text;
                } else { return null; }
                
            } catch (error) { alert("通信沈黙：サーバーへの接続に失敗しました。"); return null; }
        }

        function buildLogElement(log, index) {
            var wrapper = document.createElement("div"); wrapper.className = log.sender === "User" ? "log-user" : "log-ai";
            var meta = document.createElement("div"); meta.className = "log-meta";
            var cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "log-checkbox"; cb.value = index; meta.appendChild(cb);
            var span = document.createElement("span"); span.innerHTML = (log.time || "") + (log.sender === "User" ? " 船長：" : " かなえ："); meta.appendChild(span);
            var textNode = document.createElement("div"); textNode.style.whiteSpace = "pre-wrap"; textNode.textContent = log.text;
            
            if (log.attachedFiles && log.attachedFiles.length > 0) {
                var attachDiv = document.createElement("div");
                attachDiv.style.cssText = "font-size:12px; color:#8e44ad; font-weight:bold; margin-bottom:8px; padding:4px 8px; background:#f4f4f5; border-radius:4px; display:inline-block;";
                var fileNames = [];
                log.attachedFiles.forEach(function(f){ fileNames.push(f.name); });
                attachDiv.textContent = "📎 添付ファイル: " + fileNames.join(", ");
                textNode.insertBefore(attachDiv, textNode.firstChild);
            }

            wrapper.appendChild(meta); wrapper.appendChild(textNode);
            return wrapper;
        }

        sendBtn.onclick = async function() {
            var text = inputArea.value;
            var currentFiles = postedFiles.length > 0 ? postedFiles.slice() : null; 

            if (text !== "" || currentFiles) { 
                sendBtn.disabled = true; sendBtn.innerText = "通信中..."; 

                inputArea.value = ""; inputArea.style.height = 'auto';
                let startTime = performance.now();
                renderTimers("0.0秒...");
                let timerInterval = setInterval(function() { renderTimers(((performance.now() - startTime) / 1000).toFixed(1) + "秒..."); }, 100);
                await Promise.race([
                    new Promise(function(r) { requestAnimationFrame(function() { setTimeout(r, 0); }); }),
                    new Promise(function(r) { setTimeout(r, 100); })
                ]);
                
                var nowNum = Date.now();
                var userLog = { 
                    id: nowNum,
                    app_type: "chat",
                    sender: "User", 
                    time: getFormattedTime(), 
                    text: text || "（ファイルのみ送信）", 
                    attachedFiles: currentFiles || [],
                    tags: [],
                    linked_ids: [],
                    status: "published",
                    created_at: nowNum,
                    updated_at: nowNum
                };
                
                chatLogArray.push(userLog); 
                appendLogElement(chatLogArray.length - 1);
                await db.collection("records").doc(nowNum.toString()).set(userLog);
                
                if (currentFiles) { clearPostedFiles(); }

                setTimeout(() => { inputArea.value = ""; }, 10);

                var aiResponseText = await fetchGeminiAPI();
                clearInterval(timerInterval);
                timeHistory.push(((performance.now() - startTime) / 1000).toFixed(1) + "秒"); if (timeHistory.length > 1) timeHistory.shift(); renderTimers();

                if (aiResponseText !== null) {
                    var aiNum = Date.now();
                    var aiLog = { 
                        id: aiNum,
                        app_type: "chat",
                        sender: "kanae", 
                        time: getFormattedTime(), 
                        text: aiResponseText, 
                        attachedFiles: [],
                        tags: [],
                        linked_ids: [],
                        status: "published",
                        created_at: aiNum,
                        updated_at: aiNum
                    };
                    
                    chatLogArray.push(aiLog);
                    sessionWaltzCount++; localStorage.setItem(WALTZ_COUNT_VAULT, sessionWaltzCount);
                    appendLogElement(chatLogArray.length - 1);
                    updateMailbox(aiResponseText);
                    await db.collection("records").doc(aiNum.toString()).set(aiLog);
                }

                var lenBefore = chatLogArray.length;
                enforceMemoryLimit();
                if (chatLogArray.length !== lenBefore) renderLogs();

                sendBtn.disabled = false; sendBtn.innerText = "送 信";
            }
        };
    </script>
</body>
</html>
