<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>アレキサンドリア（大図書館・工房）</title>
<style>
/* ==========================================
   1. 基本レイアウトとUIの美学（イフリート継承）
========================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: #ffffff; color: #595959; font-family: sans-serif; }

/* ヘッダー・ナビゲーション */
header { flex: none; background: #2c3e50; color: #fff; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: bold; font-size: 14px; z-index: 30; }
header small { font-weight: normal; opacity: .75; font-size: 11px; }
#stat { margin-left: auto; font-weight: normal; font-size: 12px; opacity: .9; }
#err { flex: none; background: #c0392b; color: #fff; padding: 6px 12px; font-size: 12px; white-space: pre-wrap; }

nav { flex: none; display: flex; background: #34495e; }
nav button { flex: 1; padding: 12px 4px; border: 0; background: none; color: #bdc3c7; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
nav button.on { color: #fff; background: #2980b9; }

.tab { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; background: #f4f4f5; }
.hidden { display: none !important; }

/* フォームパーツ */
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
input[type=search], input[type=date], input[type=text], select { padding: 8px; border: 1px solid #95a5a6; border-radius: 4px; font-size: 14px; background: #fff; color: #2c3e50; outline: none; }
input[type=search] { flex: 1; min-width: 160px; }
.btn { padding: 8px 12px; border: 0; border-radius: 4px; background: #2980b9; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
.btn.gray { background: #7f8c8d; }
.btn.red { background: #c0392b; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.note { font-size: 12px; color: #7f8c8d; margin: 6px 0 10px; line-height: 1.6; }
h3 { margin: 16px 0 6px; font-size: 15px; color: #2c3e50; }

/* 格納庫のリスト */
#total { font-size: 12px; color: #555; margin: 6px 0; white-space: pre-wrap; }
.frow { background: #fff; border: 1px solid #bdc3c7; border-radius: 4px; padding: 10px; margin: 6px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.frow input[type=checkbox] { width: 18px; height: 18px; flex: none; cursor: pointer; }
.frow .info { flex: 1; min-width: 150px; font-size: 13px; line-height: 1.5; word-break: break-all; white-space: pre-wrap; }

/* ==========================================
   2. 閲覧タブ（イフリートの美学・吹き出し排除）
========================================== */
#tab-view { display: flex; flex-direction: column; padding: 0; overflow: hidden; background: #ffffff; }
#vbar { flex: none; padding: 8px 12px; background: #ecf0f1; border-bottom: 1px solid #bdc3c7; }
#vinfo { font-size: 12px; color: #7f8c8d; margin-bottom: 6px; min-height: 16px; }
#selbar, #ovbar { margin-bottom: 0; }
#ovbar { margin-bottom: 6px; font-size: 12px; }
#selinfo { font-size: 13px; font-weight: bold; color: #2c3e50; }
#selmsg { font-size: 12px; color: #27ae60; }

#viewer { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; position: relative; background: #ffffff; }
.dayhead { margin: 25px 0 15px; padding: 6px 10px; background: #34495e; color: #fff; border-radius: 4px; font-weight: bold; font-size: 13px; }

/* ログのスタイル（イフリート標準） */
.log-row { display: flex; flex-direction: column; font-family: "MS UI Gothic", "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 16px; line-height: 1.6; padding-bottom: 25px; margin-bottom: 25px; -webkit-user-select: text; user-select: text; transition: background-color 2s; }
.log-meta { font-size: 12px; color: #737373; margin-bottom: 5px; font-family: sans-serif; display: flex; align-items: center; gap: 5px; -webkit-user-select: none; user-select: none; }
.log-checkbox { width: 14px; height: 14px; cursor: pointer; }
.msg-main { padding-left: 19px; } 

.search-word { font-family: sans-serif; font-size: 12px; color: #2980b9; font-weight: bold; margin-bottom: 4px; background: #ecf0f1; padding: 4px 8px; border-radius: 4px; display: inline-block; }
.log-body { white-space: pre-wrap; word-break: break-all; }

.flash { background-color: #fff9c4 !important; }

/* 検索結果リスト */
.hit { background: #fff; border: 1px solid #bdc3c7; border-radius: 4px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
.hit:hover { background: #f4f4f5; }
.snip { white-space: pre-wrap; line-height: 1.6; word-break: break-all; font-size: 14px; }
mark { background: #f1c40f; padding: 0 2px; border-radius: 2px; color: #2c3e50; font-weight: bold; }
#hitcount { margin: 6px 0; font-size: 12px; color: #7f8c8d; }

/* ==========================================
   3. メモコンソール（工房）
========================================== */
#memo-container { display: flex; gap: 10px; flex: 1; min-height: 0; }
#memo-list-wrapper { flex: 1; max-width: 250px; display: flex; flex-direction: column; gap: 8px; }
#memo-list-container { flex: 1; overflow-y: auto; background: #2c3e50; border: 1px solid #7f8c8d; border-radius: 4px; }
.memo-list-item { padding: 10px 12px; border-bottom: 1px solid #7f8c8d; cursor: pointer; font-size: 13px; color: #bdc3c7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.memo-list-item:hover { background-color: #34495e; color: #fff; }
.memo-list-item.active { background-color: #3498db; color: #fff; font-weight: bold; border-left: 4px solid #f1c40f; padding-left: 8px; }

#memo-editor-wrapper { flex: 2; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
#memo-editor { flex: 1; width: 100%; resize: none; padding: 12px; border-radius: 4px; border: 1px solid #bdc3c7; font-size: 14px; background: #fff; color: #2c3e50; line-height: 1.5; outline: none; }
</style>
</head>
<body>

<header><span>🏛️ アレキサンドリア</span><small>版 20261020-Final</small><span id="stat"></span></header>
<div id="err" class="hidden"></div>

<nav>
  <button data-tab="view" class="on">閲覧</button>
  <button data-tab="search">検索</button>
  <button data-tab="vault">格納庫</button>
  <button data-tab="memos">工房 (メモ)</button>
</nav>

<!-- 閲覧タブ -->
<section id="tab-view" class="tab">
  <div id="vbar">
    <div class="row">
      <input type="date" id="vdate">
      <button class="btn gray" id="vprev">◀ 前の日</button>
      <button class="btn gray" id="vnext">次の日 ▶</button>
      <button class="btn gray" id="vtop">先頭</button>
      <button class="btn gray" id="vend">末尾</button>
    </div>
    <div id="vinfo"></div>
    <div class="row hidden" id="ovbar">
      <span id="ovname"></span>
      <button class="btn" id="ovback">チェックの選択に戻る</button>
    </div>
       <div class="row" id="selbar">
      <span id="selinfo"></span>
      <button class="btn" id="bcopy">コピー</button>
      <button class="btn" id="bsendmemo" style="background:#8e44ad;">工房へ送る</button>
      <button class="btn red" id="bdel">削除 (DB連動)</button>
      <button class="btn gray" id="bclr">選択解除</button>
      <span id="selmsg"></span>
    </div></div>
  <div id="viewer"></div>
</section>

<!-- 検索タブ -->
<section id="tab-search" class="tab hidden">
  <div class="row">
    <input id="q" type="search" placeholder="語（空白区切りでAND）">
    <button class="btn" id="go">歴史を検索</button>
  </div>
  <div class="row"><label style="font-size: 13px;"><input type="checkbox" id="desc"> 新しい順</label></div>
  <p class="note">対象は、格納庫でチェックした本（ファイル）です。チェックが0個なら、全部の週ファイルが対象です。<br>結果をクリックすると、閲覧タブの該当の文脈（行）へジャンプします。</p>
  <div id="hitcount"></div>
  <div id="results"></div>
</section>

<!-- 格納庫タブ -->
<section id="tab-vault" class="tab hidden">
  <p class="note">マザー（大きなファイル）を入れると、持ち主ごとに週ファイルを自動でスライス（製本）します。<br>※過去のレガシーJSONも、読み込み時に検索ワードを自動で発掘・洗浄します。</p>
  <div class="row">
    <label style="font-size: 13px;">持ち主（ファイル名が kanae か shiori で始まらないときに使います）
      <select id="ownerSel"><option value="">未選択</option><option value="kanae">かなえ</option><option value="shiori">栞</option></select>
    </label>
  </div>
  <div class="row">
    <label style="font-size: 13px;">本棚の絞り込み
      <select id="ownerFilter"><option value="">すべて</option><option value="kanae">かなえ</option><option value="shiori">栞</option></select>
    </label>
  </div>
  <div id="total"></div>
  <pre id="log" style="font-size:11px; color:#c0392b; white-space:pre-wrap; margin-bottom:8px;"></pre>

  <h3>マザー（大きなファイル）</h3>
  <input type="file" id="inBig" multiple accept=".json">
  <div class="row" style="margin-top:8px">
    <button class="btn gray" id="allBig">表示中を全選択</button>
    <button class="btn gray" id="noBig">全解除</button>
  </div>
  <div id="listBig"></div>

  <h3>本棚（週ファイル）</h3>
  <p class="note">これをチェックして「閲覧タブ」を開くことで、その週の歴史を通読できます。</p>
  <input type="file" id="inWeek" multiple accept=".json">
  <div class="row" style="margin-top:8px">
    <button class="btn gray" id="allWeek">表示中を全選択</button>
    <button class="btn gray" id="noWeek">全解除</button>
  </div>
  <div id="listWeek"></div>
</section>

<!-- 工房（メモ）タブ -->
<section id="tab-memos" class="tab hidden" style="display: flex; flex-direction: column;">
  <div class="row" style="margin-bottom: 12px; flex: none;">
      <input type="text" id="memo-search-input" placeholder="メモ内を検索..." style="flex: 1;">
      <button id="btn-memo-search" class="btn">次へ検索</button>
      <button id="btn-add-memo" class="btn" style="background: #8e44ad;">＋ 新規プロンプト</button>
  </div>
  
  <div id="memo-container">
      <div id="memo-list-wrapper">
          <div id="memo-list-container"></div>
      </div>
      
      <div id="memo-editor-wrapper">
          <textarea id="memo-editor" placeholder="閲覧タブでコピーした履歴をここに貼り付け、新たなプロンプトを練り上げてください。"></textarea>
          <div style="display: flex; gap: 8px;">
              <button id="btn-delete-memo" class="btn red" style="flex:1;">削除</button>
              <button id="btn-save-memo" class="btn" style="flex:2;">保存・更新</button>
          </div>
      </div>
  </div>
</section>

<script>
"use strict";
(() => {
const DB_NAME = "alexandria_db", CHUNK = 150, LIMIT = 300;
const OWNER_NAME = { kanae: "かなえ", shiori: "栞" };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const tick = () => new Promise(r => setTimeout(r, 0));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const kindOf = id => id.slice(0, id.indexOf(":"));
const nameCmp = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);

function showErr(e) {
  const b = $("err"); b.textContent = "エラー: " + (e && e.message ? e.message : e) + "（タップで消す）"; b.classList.remove("hidden");
}
$("err").onclick = () => $("err").classList.add("hidden");
window.addEventListener("error", ev => showErr(ev.message));
window.addEventListener("unhandledrejection", ev => showErr(ev.reason));

/* ========== 時刻・週 ========== */
function timeKey(s) {
  const m = /(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\D+(\d{1,2}):(\d{2})/.exec(s);
  return m ? Number(m[1]) * 1e8 + Number(m[2]) * 1e6 + Number(m[3]) * 1e4 + Number(m[4]) * 100 + Number(m[5]) : null;
}
const ymd = t => (t ? `${Math.floor(t / 1e8)}-${pad(Math.floor(t / 1e6) % 100)}-${pad(Math.floor(t / 1e4) % 100)}` : "");
function dayLabel(day) {
  const p = day.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
  return `${p[0]}/${p[1]}/${p[2]}(${WD[d.getDay()]})`;
}
function weekKey(t) {
  if (!t) return "undated";
  const d = new Date(Math.floor(t / 1e8), Math.floor(t / 1e6) % 100 - 1, Math.floor(t / 1e4) % 100);
  d.setDate(d.getDate() - d.getDay());
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
}
function withTimes(msgs) {
  let last = 0;
  return msgs.map((m, i) => { let t = timeKey(m.time); if (t === null) t = last; else last = t; return { m, i, t }; });
}
function sortMsgs(msgs) {
  const k = withTimes(msgs);
  k.sort((a, b) => a.t - b.t || a.i - b.i);
  return k.map(x => x.m);
}
function uniq(msgs) {
  const seen = new Set(), out = [];
  for (const m of msgs) {
    const k = `${m.time}\u0001${m.sender}\u0001${m.text}`;
    if (!seen.has(k)) { seen.add(k); out.push(m); }
  }
  return out;
}
function splitWeeks(msgs) {
  const g = new Map();
  for (const x of withTimes(msgs)) {
    const k = weekKey(x.t);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(x.m);
  }
  return g;
}
function rangeName(msgs) {
  let f = null, l = null;
  for (const m of msgs) { const t = timeKey(m.time); if (t !== null) { if (f === null) f = t; l = t; } }
  const d8 = t => (t ? ymd(t).replace(/-/g, "") : "undated");
  return `${d8(f)}-${d8(l)}`;
}
const nameOf = (sender, owner) => (sender === "船長" ? "船長" : /^ai$/i.test(sender) ? (OWNER_NAME[owner] || "AI") : sender);

/* ========== 読み取り・持ち主・マイグレーション洗浄 ========== */
function parseMsgs(text) {
  const arr = JSON.parse(text.replace(/^\uFEFF/, ""));
  if (!Array.isArray(arr)) throw new Error("配列ではありません");
  const msgs = [];
  for (const x of arr) {
    if (x && typeof x === "object" && typeof x.text === "string") {
      let sw = x.search_word || null;
      if (!sw && x.thinking) {
          const match = x.thinking.match(/\[検索\]\s*(\{.*?\})/);
          if (match) {
              try { const sObj = JSON.parse(match[1]); sw = sObj.query || sObj.search_query || match[1]; } 
              catch(e) { sw = match[1]; }
          }
      }
      // ★究極の防壁（ホワイトリスト方式）
      msgs.push({ 
          time: String(x.time ?? ""), 
          sender: String(x.sender ?? "?"), 
          text: x.text, 
          search_word: sw 
      });
    }
  }
  return { msgs, skipped: arr.length - msgs.length };
}
function ownerOf(fileName) {
  const m = /^(kanae|shiori)/i.exec(fileName);
  return m ? m[1].toLowerCase() : $("ownerSel").value;
}

/* ========== IndexedDB ========== */
let db = null, metas = new Map();
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txP = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error || new Error("DBの書き込みに失敗")); });
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("meta", { keyPath: "id" }); r.result.createObjectStore("body", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const getAllMeta = () => reqP(db.transaction("meta").objectStore("meta").getAll());
async function getBody(id) {
  const r = await reqP(db.transaction("body").objectStore("body").get(id));
  return r ? r.msgs : [];
}
function makeMeta(kind, name, owner, msgs) {
  let chars = 0, first = null, last = null;
  for (const m of msgs) { chars += m.text.length; if (timeKey(m.time) !== null) { if (first === null) first = m.time; last = m.time; } }
  return { id: `${kind}:${name}`, kind, name, owner, n: msgs.length, chars, first, last };
}
async function putFiles(list) {
  const t = db.transaction(["meta", "body"], "readwrite");
  for (const f of list) {
    const meta = makeMeta(f.kind, f.name, f.owner, f.msgs);
    t.objectStore("meta").put(meta);
    t.objectStore("body").put({ id: meta.id, msgs: f.msgs });
  }
  await txP(t);
}
async function removeFiles(ids) {
  const t = db.transaction(["meta", "body"], "readwrite");
  for (const id of ids) { t.objectStore("meta").delete(id); t.objectStore("body").delete(id); }
  await txP(t);
}

/* ========== 格納庫 ========== */
const checked = new Set();
let dirtyView = true, override = null, curTab = "view";
const setLog = lines => { $("log").textContent = lines.join("\n"); setTimeout(() => $("log").textContent="", 5000); };

function download(name, content) {
  const url = URL.createObjectURL(new Blob([content], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function updateStat() {
  let big = 0, week = 0;
  for (const m of metas.values()) { if (m.kind === "big") big++; else week++; }
  $("stat").textContent = `マザー${big} / 本棚${week} / 読書中${checked.size}冊`;
}
async function refresh(p) {
  const list = await getAllMeta();
  metas = new Map(list.map(m => [m.id, m]));
  for (const id of [...checked]) if (!metas.has(id)) checked.delete(id);
  if (override && !metas.has(override)) override = null;
  dirtyView = true;
  renderLists(); updateStat();
  if (curTab === "view") ensureView(p);
}
function afterCheck() { override = null; dirtyView = true; renderLists(); updateStat(); }
function setChecked(id, on) {
  if (on) { for (const c of [...checked]) if (kindOf(c) !== kindOf(id)) checked.delete(c); checked.add(id); }
  else checked.delete(id);
  afterCheck();
}
function visibleMetas(kind) {
  const f = $("ownerFilter").value;
  return [...metas.values()].filter(m => m.kind === kind && (!f || m.owner === f)).sort(nameCmp);
}
function renderLists() {
  for (const kind of ["big", "week"]) {
    const box = $(kind === "big" ? "listBig" : "listWeek"); box.innerHTML = "";
    const rows = visibleMetas(kind);
    if (!rows.length) { box.textContent = "なし"; continue; }
    for (const m of rows) {
      const row = mk("div", "frow");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = checked.has(m.id);
      cb.onchange = () => setChecked(m.id, cb.checked);
      row.appendChild(cb);
      row.appendChild(mk("div", "info", `${OWNER_NAME[m.owner]}　${m.name}\n${m.n}ターン　${m.first ? m.first + " ～ " + m.last : "日時なし"}`));
      const ex = mk("button", "btn gray", "書き出し");
      ex.onclick = async () => { try { download(`${m.name}.json`, JSON.stringify(await getBody(m.id), null, 2)); } catch (e) { showErr(e); } };
      const del = mk("button", "btn red", "DBから削除");
      del.onclick = async () => {
        if (!confirm(`${m.name} を削除しますか？`)) return;
        try { await removeFiles([m.id]); setLog([`${m.name} を削除しました。`]); await refresh(); } catch (e) { showErr(e); }
      };
      row.appendChild(ex); row.appendChild(del); box.appendChild(row);
    }
  }
  const sum = { big: [0, 0, 0], week: [0, 0, 0] };
  for (const m of metas.values()) { const s = sum[m.kind]; s[0]++; s[1] += m.n; s[2] += m.chars || 0; }
  $("total").textContent = `マザー ${sum.big[0]}個 / ${sum.big[1].toLocaleString()}ターン / ${sum.big[2].toLocaleString()}字\n本棚 ${sum.week[0]}個 / ${sum.week[1].toLocaleString()}ターン / ${sum.week[2].toLocaleString()}字`;
}
$("ownerFilter").onchange = renderLists;
function selectVisible(kind, on) {
  if (on) { for (const c of [...checked]) if (kindOf(c) !== kind) checked.delete(c); for (const m of visibleMetas(kind)) checked.add(m.id); }
  else { for (const c of [...checked]) if (kindOf(c) === kind) checked.delete(c); }
  afterCheck();
}
$("allBig").onclick = () => selectVisible("big", true);
$("noBig").onclick = () => selectVisible("big", false);
$("allWeek").onclick = () => selectVisible("week", true);
$("noWeek").onclick = () => selectVisible("week", false);

$("inBig").onchange = async e => {
  const files = [...e.target.files], logs = [], groups = new Map();
  setLog(["マザー読み込み＆自動製本・洗浄中…"]);
  try {
    for (const f of files) {
      const owner = ownerOf(f.name);
      if (!owner) { logs.push(`${f.name}: 持ち主不明。`); continue; }
      try {
        const p = parseMsgs(await f.text());
        if (!groups.has(owner)) groups.set(owner, { n: 0, msgs: [] });
        const g = groups.get(owner); g.n++; g.msgs.push(...p.msgs);
      } catch (err) { logs.push(`${f.name}: エラー ${err.message}`); }
      await tick();
    }
    for (const [owner, g] of groups) {
      const all = sortMsgs(uniq(g.msgs)), dup = g.msgs.length - all.length;
      if (!all.length) continue;
      const bigName = `${owner}_big_${rangeName(all)}`, list = [{ kind: "big", name: bigName, owner, msgs: all }];
      let replaced = metas.has(`big:${bigName}`) ? 1 : 0, weeks = 0;
      for (const [wk, ms] of splitWeeks(all)) {
        const name = `${owner}_week_${wk}`;
        if (metas.has(`week:${name}`)) replaced++;
        list.push({ kind: "week", name, owner, msgs: ms }); weeks++;
      }
      await putFiles(list);
      logs.push(`${OWNER_NAME[owner]}: ${all.length}ターンを製本完了。本棚に${weeks}冊追加しました。`);
    }
    setLog(logs); await refresh();
  } catch (err) { showErr(err); }
  e.target.value = "";
};

$("inWeek").onchange = async e => {
  const files = [...e.target.files], logs = [];
  setLog(["本棚読み込み中…"]);
  try {
    for (const f of files) {
      const owner = ownerOf(f.name);
      if (!owner) continue;
      try {
        const p = parseMsgs(await f.text());
        if (!p.msgs.length) continue;
        const base = f.name.replace(/\.json$/i, "");
        const name = base.toLowerCase().startsWith(owner) ? base : `${owner}_${base}`;
        await putFiles([{ kind: "week", name, owner, msgs: sortMsgs(uniq(p.msgs)) }]);
        logs.push(`${name}: 追加完了`);
      } catch (err) {}
    }
    setLog(logs); await refresh();
  } catch (err) { showErr(err); }
  e.target.value = "";
};

/* ========== 閲覧 (イフリート美学) ========== */
let viewTok = 0, viewKey = "", viewScroll = 0, heads = [], days = [], keyMap = new Map(), pending = null, painted = true, rafBusy = false;
const sel = new Map();
const viewIds = () => (override ? [override] : [...checked].sort());
const cmpW = (a, b) => a.t - b.t || a.o - b.o || a.i - b.i;
const wKey = w => `${w.f}\u0001${w.i}`;
const fmtMsg = w => `【${w.m.time}】 ${nameOf(w.m.sender, w.ow)}：\n${w.m.text}`;

async function loadWrapped(id, order) {
  const meta = metas.get(id), ow = meta ? meta.owner : "";
  return withTimes(await getBody(id)).map(x => ({ m: x.m, f: id, i: x.i, t: x.t, o: order, ow }));
}
async function renderView(p) {
  const tok = ++viewTok, ids = viewIds(), box = $("viewer");
  dirtyView = false; viewKey = ids.join("|");
  heads = []; days = []; keyMap = new Map(); pending = p || null; painted = false;
  sel.clear(); updateSel(); box.innerHTML = "";
  $("ovbar").classList.toggle("hidden", !override);
  if (override) $("ovname").textContent = "一時表示: " + metas.get(override).name;
  if (!ids.length) { box.textContent = "格納庫タブで、読む本にチェックを入れてください。"; $("vinfo").textContent = ""; painted = true; return; }
  $("vinfo").textContent = "読み込み中…";
  try {
    const parts = await Promise.all(ids.map((id, k) => loadWrapped(id, k)));
    if (tok !== viewTok) return;
    const list = parts.flat().sort(cmpW);
    const set = new Set();
    for (const w of list) if (w.t) set.add(ymd(w.t));
    days = [...set].sort();
    if (days.length) { $("vdate").min = days[0]; $("vdate").max = days[days.length - 1]; }
    await paint(tok, list, ids.length > 1);
  } catch (err) { $("vinfo").textContent = "エラー: " + err.message; }
}

async function paint(tok, list, multi) {
  const box = $("viewer");
  let i = 0, lastDay = null;
  const status = () => { $("vinfo").textContent = `${list.length.toLocaleString()}ターン / ${days.length}日分` + (i < list.length ? `　描画中 ${i.toLocaleString()}/${list.length.toLocaleString()}` : ""); };
  if (!list.length) { painted = true; status(); return; }
  while (i < list.length) {
    await nextFrame();
    if (tok !== viewTok) return;
    const frag = document.createDocumentFragment(), end = Math.min(i + CHUNK, list.length);
    for (; i < end; i++) {
      const w = list[i], day = ymd(w.t);
      if (day !== lastDay) {
        lastDay = day;
        if (day) { const h = mk("div", "dayhead", dayLabel(day)); h.setAttribute("data-d", day); heads.push(h); frag.appendChild(h); }
      }
      
      const e = mk("div", "log-row");
      const metaRow = mk("div", "log-meta");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "log-checkbox mcb";
      cb.onchange = () => { if (cb.checked) sel.set(wKey(w), w); else sel.delete(wKey(w)); updateSel(); };
      metaRow.appendChild(cb);
      metaRow.appendChild(mk("span", "", `${w.m.time}　${nameOf(w.m.sender, w.ow)}` + (multi ? `　[${metas.get(w.f).name}]` : "")));
      e.appendChild(metaRow);

      const main = mk("div", "msg-main");
      if (w.m.search_word) {
          const swDiv = mk("div", "search-word", `🔍 検索: ${w.m.search_word}`);
          main.appendChild(swDiv);
      }
      const bodyDiv = mk("div", "log-body", w.m.text);
      main.appendChild(bodyDiv);
      e.appendChild(main);

      keyMap.set(wKey(w), e);
      frag.appendChild(e);
    }
    box.appendChild(frag);
    painted = i >= list.length;
    status(); checkPending();
  }
}

function checkPending() {
  if (!pending) return;
  const v = $("viewer"), p = pending;
  if (p.end) { if (painted) { pending = null; v.scrollTop = v.scrollHeight; updateCur(); } return; }
  if (p.top != null) { if (painted || v.scrollHeight >= p.top + v.clientHeight) { pending = null; v.scrollTop = p.top; updateCur(); } return; }
  let el = null;
  if (p.msg) el = keyMap.get(p.msg);
  else if (p.day) {
    el = heads.find(h => h.getAttribute("data-d") >= p.day) || null;
    if (!el && painted && heads.length) el = heads[heads.length - 1];
  }
  if (!el) { if (painted) pending = null; return; }
  pending = null;
  v.scrollTop = Math.max(0, el.offsetTop - (p.msg ? 8 : 0));
  if (p.msg) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2500); }
  updateCur();
}
function curHead() {
  const top = $("viewer").scrollTop + 8;
  let lo = 0, hi = heads.length - 1, ans = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (heads[mid].offsetTop <= top) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
function updateCur() { if (heads.length) $("vdate").value = heads[curHead()].getAttribute("data-d"); }
function moveDay(delta) {
  if (!heads.length) return;
  const h = heads[curHead()];
  if (delta < 0 && $("viewer").scrollTop > h.offsetTop + 20) delta = 0;
  let i = days.indexOf(h.getAttribute("data-d")) + delta;
  i = Math.max(0, Math.min(days.length - 1, i));
  pending = { day: days[i] }; checkPending();
}
function ensureView(p) {
  if (dirtyView || viewIds().join("|") !== viewKey) return renderView(p);
  if (p) { pending = p; checkPending(); } else $("viewer").scrollTop = viewScroll;
}
$("vdate").onchange = function () {
  if (!this.value || !days.length) return;
  pending = { day: days.find(d => d >= this.value) || days[days.length - 1] }; checkPending();
};
$("vprev").onclick = () => moveDay(-1);
$("vnext").onclick = () => moveDay(1);
$("vtop").onclick = () => { pending = null; $("viewer").scrollTop = 0; updateCur(); };
$("vend").onclick = () => { pending = { end: true }; checkPending(); };
$("viewer").addEventListener("scroll", () => {
  if (rafBusy) return; rafBusy = true;
  requestAnimationFrame(() => { rafBusy = false; updateCur(); });
});
$("ovback").onclick = () => { override = null; renderView(); };

/* ---- 閲覧タブのコピー・削除 ---- */
function updateSel() {
  $("selinfo").textContent = `選択 ${sel.size}件`;
  for (const id of ["bcopy", "bdel", "bclr"]) $(id).disabled = !sel.size;
}
const selMsg = s => { $("selmsg").textContent = s; setTimeout(() => { if ($("selmsg").textContent === s) $("selmsg").textContent = ""; }, 3000); };
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); return true; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}
$("bcopy").onclick = async () => {
  const items = [...sel.values()].sort(cmpW);
  if (!items.length) return;
  selMsg((await copyText(items.map(fmtMsg).join("\n\n"))) ? `${items.length}件をコピーしました。メモ工房へ貼り付けてください。` : "コピー失敗");
};
  $("bsendmemo").onclick = () => {
  const items = [...sel.values()].sort(cmpW);
  if (!items.length) return;
  
  const appendText = items.map(fmtMsg).join("\n\n");
  
  if (memoArray.length === 0) {
      memoArray.push(appendText);
      activeMemoIndex = 0;
  } else {
      if (activeMemoIndex < 0) activeMemoIndex = 0;
      memoArray[activeMemoIndex] = memoArray[activeMemoIndex] + (memoArray[activeMemoIndex] ? "\n\n---\n\n" : "") + appendText;
  }
  
  saveMemosToStorage();
  renderMemoDial();
  selMsg(`工房のメモに${items.length}件の歴史を転送しました`);
  $("bclr").click(); 
};
$("bclr").onclick = () => {
  sel.clear(); updateSel();
  for (const cb of document.querySelectorAll("#viewer .mcb")) cb.checked = false;
};
$("bdel").onclick = async () => {
  const items = [...sel.values()];
  if (!items.length) return;
  if (!confirm(`${items.length}件の歴史をマザーDBから物理削除しますか？`)) return;
  try {
    const top = $("viewer").scrollTop, byFile = new Map();
    for (const w of items) { if (!byFile.has(w.f)) byFile.set(w.f, new Set()); byFile.get(w.f).add(w.i); }
    const list = [];
    for (const [id, idx] of byFile) {
      const meta = metas.get(id), msgs = (await getBody(id)).filter((_, i) => !idx.has(i));
      list.push({ kind: meta.kind, name: meta.name, owner: meta.owner, msgs });
    }
    await putFiles(list);
    await refresh({ top });
    selMsg(`DBから${items.length}件を物理削除しました`);
  } catch (err) { showErr(err); }
};

/* ========== 検索 (栞ロジック継承) ========== */
let searchTok = 0;
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function appendHL(parent, text, re) {
  text.split(re).forEach((p, i) => {
    if (i % 2 === 1) parent.appendChild(mk("mark", "", p));
    else if (p) parent.appendChild(document.createTextNode(p));
  });
}
async function doSearch() {
  const q = $("q").value.trim(); if (!q) return;
  const tok = ++searchTok, hits = [];
  const terms = q.toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
  const re = new RegExp("(" + terms.map(esc).join("|") + ")", "gi");
  let ids = [...checked].sort(), scope = `読書中の本 ${ids.length}冊`;
  if (!ids.length) { ids = [...metas.values()].filter(m => m.kind === "week").map(m => m.id).sort(); scope = "本棚のすべての本"; }
  $("results").innerHTML = "";
  try {
    for (let k = 0; k < ids.length; k++) {
      if (tok !== searchTok) return;
      $("hitcount").textContent = `検索中 ${k}/${ids.length}冊　ヒット ${hits.length}件`;
      for (const w of await loadWrapped(ids[k], k)) {
        const s = (w.m.text + (w.m.search_word||"")).toLowerCase();
        if (terms.every(t => s.includes(t))) hits.push(w);
      }
      await tick();
    }
    if (tok !== searchTok) return;
    hits.sort(cmpW);
    if ($("desc").checked) hits.reverse();
    $("hitcount").textContent = `${hits.length.toLocaleString()}件（対象: ${scope}）` + (hits.length > LIMIT ? `　先頭${LIMIT}件を表示。語を足すと絞れます` : "");
    const box = $("results");
    for (const w of hits.slice(0, LIMIT)) {
      const d = mk("div", "hit"), text = w.m.search_word ? `[検索: ${w.m.search_word}]\n${w.m.text}` : w.m.text, low = text.toLowerCase();
      d.appendChild(mk("div", "meta", `${w.m.time}　${nameOf(w.m.sender, w.ow)}　[${metas.get(w.f).name}]`));
      let idx = low.indexOf(terms[0]); if (idx < 0) idx = 0;
      const s = Math.max(0, idx - 40), e = Math.min(text.length, idx + terms[0].length + 80);
      const sn = mk("div", "snip");
      appendHL(sn, (s > 0 ? "…" : "") + text.slice(s, e) + (e < text.length ? "…" : ""), re);
      d.appendChild(sn);
      d.onclick = () => openFromSearch(w);
      box.appendChild(d);
    }
  } catch (err) { $("hitcount").textContent = "エラー: " + err.message; }
}
function openFromSearch(w) {
  override = checked.has(w.f) ? null : w.f;
  showTab("view");
  ensureView({ msg: wKey(w) });
}
$("go").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

/* ========== 工房（メモ）コンソール ========== */
const MEMO_VAULT = "alexandria_memos_array";
let memoArray = [];
let activeMemoIndex = -1;
const memoListContainer = $("memo-list-container");
const memoEditor = $("memo-editor");

function renderMemoDial() {
    memoListContainer.innerHTML = '';
    if (memoArray.length === 0) {
        memoListContainer.innerHTML = '<div style="padding: 15px; color:#7f8c8d; text-align:center; font-size:12px;">メモがありません。[＋新規]から作成してください。</div>';
        memoEditor.value = ''; memoEditor.disabled = true; return;
    }
    memoEditor.disabled = false;
    memoArray.forEach(function(memoText, index) {
        const item = document.createElement('div'); 
        item.className = 'memo-list-item' + (index === activeMemoIndex ? ' active' : '');
        const firstLine = memoText.split('\n')[0].trim(); item.innerText = firstLine === "" ? "(空白)" : firstLine;
        item.onclick = function() { activeMemoIndex = index; memoEditor.value = memoArray[index]; renderMemoDial(); };
        memoListContainer.appendChild(item);
    });
    if (activeMemoIndex >= 0 && activeMemoIndex < memoArray.length) { memoEditor.value = memoArray[activeMemoIndex]; } 
    else { memoEditor.value = ''; }
}

$("btn-add-memo").onclick = () => { memoArray.unshift(""); activeMemoIndex = 0; saveMemosToStorage(); renderMemoDial(); memoEditor.focus(); };

$("btn-save-memo").onclick = function() {
    if (activeMemoIndex >= 0) {
        memoArray[activeMemoIndex] = memoEditor.value; saveMemosToStorage(); renderMemoDial();
        const btn = this; const originalText = btn.innerText; btn.innerText = "更新完了"; btn.style.backgroundColor = "#27ae60"; 
        setTimeout(() => { btn.innerText = originalText; btn.style.backgroundColor = "#2980b9"; }, 1500);
    }
};

$("btn-delete-memo").onclick = () => {
    if (activeMemoIndex >= 0 && confirm("このプロンプト案を完全に削除しますか？")) { 
        memoArray.splice(activeMemoIndex, 1); activeMemoIndex = memoArray.length > 0 ? 0 : -1; saveMemosToStorage(); renderMemoDial(); 
    }
};

function saveMemosToStorage() { localStorage.setItem(MEMO_VAULT, JSON.stringify(memoArray)); }

let memoSearchIndex = -1, lastMemoQuery = "";
function executeMemoSearch() {
    const query = $("memo-search-input").value;
    if (!query || memoArray.length === 0) return;
    if (query !== lastMemoQuery) { lastMemoQuery = query; memoSearchIndex = -1; }
    
    let text = memoEditor.value;
    let nextIdx = text.indexOf(query, memoSearchIndex + 1);
    if (nextIdx !== -1) {
        memoSearchIndex = nextIdx;
    } else {
        let startIndex = activeMemoIndex >= 0 ? activeMemoIndex : 0;
        let foundMemoIdx = -1;
        for (let i = startIndex + 1; i < memoArray.length; i++) {
            if (memoArray[i].indexOf(query) !== -1) { foundMemoIdx = i; break; }
        }
        if (foundMemoIdx === -1) {
            for (let i = 0; i <= startIndex; i++) {
                if (memoArray[i].indexOf(query) !== -1) { foundMemoIdx = i; break; }
            }
        }
        if (foundMemoIdx === -1) return;
        activeMemoIndex = foundMemoIdx;
        renderMemoDial();
        memoSearchIndex = memoArray[activeMemoIndex].indexOf(query, 0);
    }
    highlightAndScrollMemo(memoEditor, memoArray[activeMemoIndex], memoSearchIndex, query.length);
}
function highlightAndScrollMemo(textarea, fullText, matchIndex, queryLength) {
    textarea.focus();
    textarea.setSelectionRange(matchIndex, matchIndex + queryLength);
    const textBeforeMatch = fullText.substring(0, matchIndex);
    const lineNumbers = textBeforeMatch.split('\n').length;
    const lineHeight = parseInt(window.getComputedStyle(textarea).lineHeight) || 20;
    textarea.scrollTop = (lineNumbers - 1) * lineHeight - (textarea.clientHeight / 2);
}
$("btn-memo-search").addEventListener('click', executeMemoSearch);
$("memo-search-input").addEventListener('keydown', e => { if (e.key === 'Enter') executeMemoSearch(); });

/* ========== タブ・起動 ========== */
function showTab(name) {
  if (curTab === "view") viewScroll = $("viewer").scrollTop;
  curTab = name;
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.tab === name);
  for (const t of ["view", "search", "vault", "memos"]) $("tab-" + t).classList.toggle("hidden", t !== name);
  if (name === "memos") renderMemoDial();
}
for (const b of document.querySelectorAll("nav button")) {
  b.onclick = () => { showTab(b.dataset.tab); if (b.dataset.tab === "view") ensureView(); };
}
updateSel();

(async () => {
  if (!window.indexedDB) { $("stat").textContent = "IndexedDBが使えません"; return; }
  
  const savedMemos = localStorage.getItem(MEMO_VAULT);
  if (savedMemos) { memoArray = JSON.parse(savedMemos); if(memoArray.length>0) activeMemoIndex=0; }
  
  try {
    db = await openDB();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await refresh();
    if (!metas.size) showTab("vault");
  } catch (err) { showErr(err); }
})();
})();
</script>
